<title>Dax, la ville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Playball&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Un lieu à la fois (trois rues photographiées à Dax) : on y marche, la caméra te suit et avance avec toi (la rue
   grossit quand tu t'approches d'une vitrine). Les présents se promènent, les absents restent translucides. Les
   annonces sont des écrans posés dans les vitrines, en perspective. Mini-carte, recherche des commerces.
   Téléphone (vertical) comme ordinateur (horizontal). Un seul monde : le thème n'y change rien. */
:root{
  --nuit:#12070F;--verre:rgba(24,10,20,.72);--verre-bord:rgba(255,255,255,.16);
  --rose:#FF2E9A;--or:#F2C46B;--vert:#3DE2A6;--rouge:#FF4D5E;--creme:#FFF4E6;--doux:#D9C3CB;--papier:#FFF8EF;--papier-2:#F3E7DA;--encre:#2A1622;--gris:#7A6470;
  --affiche:"Grandstander",ui-rounded,system-ui,sans-serif;--texte:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--nuit);color:var(--creme);font-family:var(--texte);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.app{position:fixed;inset:0;overflow:hidden;background:#000}
.lieu-vue{position:absolute;inset:0;z-index:0;overflow:hidden}
.monde{position:absolute;top:0;left:0;transform-origin:0 0;transition:filter .45s,opacity .45s;will-change:transform}
.monde.part{filter:blur(6px);opacity:0}
.decor{position:absolute;inset:0;background:center/100% 100% no-repeat}
.sol{position:absolute;inset:0;cursor:pointer}
.ecran-vit{position:absolute;left:0;top:0;transform-origin:0 0;padding:0;border:0;background:#050505;cursor:pointer;box-shadow:0 0 0 1.5px #0b0b0b,0 0 0 2.5px #3a3a3a,0 4px 8px rgba(0,0,0,.45)}
.ecran-vit .meneau{position:absolute;z-index:3;top:-3%;bottom:-3%;width:9%;transform:translateX(-50%);box-shadow:inset 1px 0 rgba(255,255,255,.18),inset -1px 0 rgba(0,0,0,.35)}
.enseigne-p{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.enseigne-p svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.ecran-vit video{display:block;width:100%;height:100%;object-fit:cover;opacity:.25;filter:grayscale(.5) brightness(.6);transition:opacity .8s,filter .8s}
.ecran-vit.allume video{opacity:1;filter:none}
.ecran-vit::before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.28),transparent 30%,transparent 72%,rgba(255,255,255,.1));pointer-events:none;z-index:2}
.pastille{position:absolute;z-index:120;transform:translate(-50%,-100%);transform-origin:0 0;scale:var(--inv,1);display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 8px 18px -6px rgba(255,46,154,.9);animation:flotte 2.4s ease-in-out infinite;transition:opacity .4s}
.pastille.cachee{opacity:0;pointer-events:none}
@keyframes flotte{50%{transform:translate(-50%,calc(-100% - 5px))}}
.enseigne{position:absolute;transform:translate(-50%,-50%);padding:.2em .7em;border-radius:12px;background:#3B2618;border:3px solid #C99A5B;color:#FFE7B8;font-family:var(--affiche);font-weight:800;white-space:nowrap;box-shadow:0 6px 14px rgba(0,0,0,.45);pointer-events:none}
.plaque{position:absolute;transform:translate(-50%,0);padding:.15em .55em;border-radius:6px;background:var(--papier);color:var(--encre);font-family:var(--affiche);font-weight:800;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.4);pointer-events:none}
.sortie{position:absolute;transform:translate(-50%,-100%);transform-origin:0 0;scale:var(--inv,1);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0;cursor:pointer}
.sortie i{font-style:normal;font-size:28px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));animation:pousse 1.6s ease-in-out infinite}
.sortie span{padding:4px 10px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);font-size:11px;font-weight:800;white-space:nowrap}
@keyframes pousse{50%{transform:translateX(5px)}}
.sortie.g i{animation-name:poussg}
@keyframes poussg{50%{transform:translateX(-5px)}}
.qui{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer}
.qui .corps{position:relative;display:block;height:100%;transform-origin:50% 100%}
.qui img{display:block;height:100%;width:auto;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
.qui .p{position:absolute;left:0;top:0;opacity:0}
.qui.ouverte .p{opacity:1}.qui.ouverte .n{opacity:0}
.qui.marche .corps{animation:balance .55s ease-in-out infinite}
.qui.gauche .corps{transform:scaleX(-1)}
.qui.gauche.marche .corps{animation-name:balanceg}
@keyframes balance{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes balanceg{0%,100%{transform:scaleX(-1) rotate(-2.5deg)}50%{transform:scaleX(-1) rotate(2.5deg)}}
.qui.absent{opacity:.46;filter:grayscale(.7)}
.qui.passant .nom{display:none}
.qui.sort{animation:sort .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes sort{from{opacity:0;transform:translate(-50%,-88%) scale(.8)}}
.qui.rentre{opacity:0;transition:opacity .35s}
.qui.absent .nom::after{content:" · pas là";font-weight:500;opacity:.8}
.qui .nom{position:absolute;left:50%;top:100%;margin-top:4px;transform:translateX(-50%);transform-origin:0 0;scale:var(--inv,1);padding:2px 8px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);font-size:10px;font-weight:700;white-space:nowrap}
.qui.toi .nom{background:var(--rose);border-color:transparent}
.qui.toi.fantome .nom{background:#6A47F0}
.cible{position:absolute;z-index:1;width:34px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.85);transform:translate(-50%,-50%);animation:cible .7s ease-out forwards;pointer-events:none}
@keyframes cible{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
.bulle{position:absolute;z-index:200;transform-origin:0 0;scale:var(--inv,1);max-width:190px;padding:8px 11px 9px;border-radius:15px;background:var(--papier);color:var(--encre);font-family:var(--affiche);font-weight:700;font-size:13px;line-height:1.2;box-shadow:0 10px 24px -8px rgba(0,0,0,.6);transform:translate(-50%,calc(-100% - 10px));animation:bulle .45s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}
.bulle::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--papier);border-bottom:0}
.bulle small{display:block;margin-bottom:2px;font-family:var(--texte);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#A1155E}
@keyframes bulle{from{opacity:0;transform:translate(-50%,calc(-100% - 2px)) scale(.6)}}
.haut{position:absolute;z-index:10;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:flex-start;gap:8px}
.etiq{display:flex;flex-direction:column;padding:6px 12px;border-radius:14px;background:var(--verre);border:1px solid var(--verre-bord);backdrop-filter:blur(8px)}
.etiq b{font-family:var(--affiche);font-size:15px;line-height:1.1}
.etiq small{font-size:10.5px;color:var(--doux)}
.rond{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--verre-bord);background:var(--verre);backdrop-filter:blur(8px);font-size:18px;cursor:pointer;flex:none}
.rond em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--rose);font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.rond.sonne{animation:sonne .7s ease-in-out 2}
@keyframes sonne{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.droite{margin-left:auto;display:flex;gap:8px}
.foule{position:absolute;z-index:10;left:10px;top:calc(62px + env(safe-area-inset-top,0px));padding:4px 10px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);font-size:10.5px;font-weight:700}
.foule small{font-weight:500;color:var(--doux)}
.bas{position:absolute;z-index:10;left:12px;right:12px;max-width:520px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.bas > *{pointer-events:auto}
.astuce{padding:6px 12px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);font-size:11.5px;font-weight:700;text-align:center}
.entrer{width:100%;height:52px;border-radius:999px;border:0;background:var(--rose);font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 26px -8px rgba(255,46,154,.95);animation:apparait2 .35s both}
.entrer small{display:block;font-size:11px;font-weight:600;opacity:.9}
.spect{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:18px;background:rgba(106,71,240,.88);font-size:12.5px;font-weight:700;text-align:center}
.spect button{margin-top:6px;padding:8px 14px;border-radius:999px;border:0;background:#fff;color:#3A1A8C;font-weight:800;cursor:pointer}
@keyframes apparait2{from{opacity:0;transform:translateY(10px)}}
.toast{position:absolute;z-index:70;left:12px;right:12px;max-width:440px;margin:0 auto;top:calc(62px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:rgba(255,248,239,.97);color:var(--encre);box-shadow:0 16px 30px -10px rgba(0,0,0,.7);animation:tombe .45s cubic-bezier(.2,1.2,.4,1) both;cursor:pointer}
.toast img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 6%;background:var(--papier-2)}
.toast b{display:block;font-size:12.5px}
.toast span{font-size:12px;color:var(--gris)}
@keyframes tombe{from{transform:translateY(-140%)}}
.maquette{position:absolute;z-index:10;right:12px;top:calc(62px + env(safe-area-inset-top,0px));font-size:9.5px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;text-align:right}
.porte{position:absolute;inset:0;z-index:80;background:url(i/porte.jpg) center/cover;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:22% 16px 14%;transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .9s ease-in .25s;transform-origin:50% 52%}
.porte.ouvre{transform:scale(2.6);opacity:0;pointer-events:none}
.porte h1{margin:0;font-family:var(--affiche);font-weight:800;font-size:clamp(38px,12vw,56px);line-height:.95;text-align:center;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.porte h1 b{color:#FF9FD2}
.porte .choix{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
.porte .choix button{padding:13px 16px;border-radius:18px;border:1px solid var(--verre-bord);background:var(--verre);backdrop-filter:blur(8px);font-weight:800;font-size:14px;cursor:pointer;text-align:left}
.porte .choix button small{display:block;font-size:11.5px;font-weight:500;color:var(--doux);margin-top:2px}
.porte .choix button.fort{background:var(--rose);border-color:transparent}
.porte .choix button.fort small{color:#fff;opacity:.9}
.porte p{margin:0;font-size:11px;color:#fff;opacity:.85;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.plein{position:absolute;inset:0;z-index:30;background:#000}
.plein[hidden]{display:none!important}
.plein video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plein::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%,transparent 52%,rgba(0,0,0,.8))}
.p-haut{position:absolute;z-index:8;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px}
.p-haut img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 6%;border:2px solid #fff;background:#3A1F2E}
.p-haut b{display:block;font-size:14.5px;line-height:1.1}
.p-haut small{font-size:11px;opacity:.9}
.p-haut .d{margin-left:auto;display:flex;gap:8px}
.p-avis{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.avis{display:flex;align-items:flex-start;gap:8px;padding:8px 10px 8px 8px;border-radius:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);font-size:13px;line-height:1.3;border:0;text-align:left;width:fit-content;max-width:88%;animation:apparait2 .4s both}
.avis img{flex:none;width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 6%;background:#3A1F2E}
.avis b{display:block;font-size:11px;opacity:.85}
.avis.voix{background:rgba(255,46,154,.38);cursor:pointer}
.p-bas{position:absolute;z-index:4;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.gros{flex:1;height:50px;border-radius:999px;border:0;background:var(--rose);font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(255,46,154,.9)}
.gros.clair{background:rgba(255,255,255,.16);box-shadow:none;border:1px solid var(--verre-bord)}
.coeurs{position:absolute;z-index:3;right:8px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:56px;height:50%;pointer-events:none}
.envole{position:absolute;font-size:22px;pointer-events:none;animation:envole 2.2s ease-out forwards}
@keyframes envole{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{transform:translate(calc(-50% + var(--dx,10px)),-160px) scale(.9);opacity:0}}
.int-scene{position:absolute;overflow:hidden;transform-origin:50% 35%;animation:dedans .9s cubic-bezier(.2,.8,.25,1) both}
.int-scene.fondu{-webkit-mask-image:linear-gradient(transparent,#000 16px);mask-image:linear-gradient(transparent,#000 16px)}
@keyframes dedans{from{transform:scale(1.22);filter:blur(7px);opacity:.15}}
.int-fond{position:absolute;inset:0;background:center/100% 100% no-repeat;filter:brightness(.86) saturate(1.05)}
.int-flou{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(22px) brightness(.42) saturate(1.1)}
.int-scene{border-radius:0 0 18px 18px;box-shadow:0 20px 40px rgba(0,0,0,.55)}
.regarder{position:absolute;z-index:3;transform:translate(-50%,0);padding:5px 10px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-size:10.5px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 8px 16px -6px rgba(255,46,154,.9);animation:flotte2 2.4s ease-in-out infinite}
@keyframes flotte2{50%{transform:translate(-50%,-4px)}}
.plein.boutique::after{background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 18%,transparent 40%,rgba(18,7,15,.94) 74%)}
.tele{position:absolute;left:0;top:0;transform-origin:0 0;padding:0;border:0;border-radius:2px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #121212,0 0 0 4px #3c3c3c,0 12px 22px rgba(0,0,0,.6);cursor:pointer}
.tele video{position:static;width:100%;height:100%;object-fit:cover}
.tele::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.22),transparent 35%)}
.tele span{position:absolute;z-index:2;left:5px;top:5px;padding:1px 5px;border-radius:4px;background:var(--rouge);font-size:8.5px;font-weight:800}
.tele b{position:absolute;z-index:2;left:50%;bottom:6px;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.55);font-size:8.5px;font-weight:800;white-space:nowrap}
.promos{position:absolute;z-index:3;left:12px;top:calc(70px + env(safe-area-inset-top,0px));width:46%;max-width:260px;padding:10px 11px 12px;border-radius:10px;background:#263129;border:5px solid #8A5A34;box-shadow:0 12px 24px rgba(0,0,0,.5);font-family:var(--affiche);color:#F4F1E6;box-sizing:border-box}
.promos.d{left:auto;right:12px}
.promos h3{margin:0 0 2px;font-size:13.5px}
.promos p{margin:6px 0 0;font-size:12.5px;line-height:1.2}
.promos .famille{position:relative;padding:6px 8px;border-radius:6px;border:1.5px dashed rgba(244,241,230,.5)}
.promos .famille.ferme span{filter:blur(4px)}
.promos .famille button{position:absolute;inset:0;border:0;border-radius:6px;background:rgba(38,49,41,.55);font-family:var(--texte);font-size:10.5px;font-weight:800;color:#fff;cursor:pointer}
.salle{position:absolute;z-index:3;left:0;right:0;top:46%;height:28%}
.patron{position:absolute;z-index:4;left:60%;top:62%;transform:translate(-50%,-100%);height:22%;background:none;border:0;padding:0;cursor:pointer}
.patron .corps{position:relative;display:block;height:100%}
.patron img{height:100%;width:auto;filter:drop-shadow(0 14px 12px rgba(0,0,0,.6))}
.patron .p{position:absolute;left:0;top:0;opacity:0}
.patron.ouverte .p{opacity:1}.patron.ouverte .n{opacity:0}
.patron .tag{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;padding:4px 9px;border-radius:999px;background:var(--papier);color:var(--encre);font-size:10.5px;font-weight:800}
.patron .tag.salue{padding:6px 12px;font-family:var(--affiche);font-size:14px;background:var(--rose);color:#fff;animation:salue .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes salue{from{transform:translate(-50%,-60%) scale(.4);opacity:0}}
.sous-titre{position:absolute;z-index:7;left:12px;right:12px;max-width:560px;margin:0 auto;top:31%;padding:10px 13px;border-radius:16px;background:var(--papier);color:var(--encre);font-family:var(--affiche);font-weight:700;font-size:15px;line-height:1.25;box-shadow:0 12px 26px -10px rgba(0,0,0,.7);animation:apparait2 .35s both}
.ici{position:absolute;z-index:5;left:12px;right:12px;max-width:620px;margin:0 auto;bottom:calc(128px + env(safe-area-inset-bottom,0px));font-size:11.5px;font-weight:700;color:var(--doux)}
.ici b{color:#fff}
.faire{position:absolute;z-index:6;left:10px;right:10px;max-width:640px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.faire button{min-width:0;padding:8px 4px;border-radius:16px;border:1px solid var(--verre-bord);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);font-size:11.5px;font-weight:800;cursor:pointer;line-height:1.15}
.faire button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.faire button.fort{background:var(--rose);border-color:transparent}
.feuille{position:absolute;z-index:50;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;max-height:82%;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--papier);color:var(--encre);animation:monte .38s cubic-bezier(.2,.9,.25,1) both;box-shadow:0 -20px 50px rgba(0,0,0,.5)}
@keyframes monte{from{transform:translateY(100%)}}
.voile{position:absolute;inset:0;z-index:49;background:rgba(10,4,8,.45)}
.feuille h3{margin:0 40px 0 0;font-family:var(--affiche);font-size:22px;line-height:1.15}
.feuille .sous{margin:4px 0 0;font-size:12.5px;color:var(--gris)}
.feuille .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--papier-2);cursor:pointer;color:var(--encre)}
.feuille textarea{display:block;width:100%;box-sizing:border-box;margin-top:12px;min-height:84px;padding:12px;border-radius:14px;border:1.5px solid #E2CFC0;background:#fff;color:var(--encre);font-size:15px;resize:none}
.feuille .envoyer{margin-top:12px;width:100%;height:48px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer}
.feuille .envoyer:disabled{opacity:.45}
.amis{display:flex;gap:10px;margin-top:12px;overflow-x:auto}
.ami{flex:none;width:72px;padding:6px 4px;border-radius:14px;border:2px solid transparent;background:#fff;text-align:center;cursor:pointer;color:var(--encre)}
.ami[aria-pressed="true"]{border-color:var(--rose);background:#FFF0F7}
.ami img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:var(--papier-2)}

  mInt = setInterval(() => { for (const p of interieur) { if (!p.la || p.k === moi() || Math.random() > 0.5) continue; const nx = Math.min(80, Math.max(6, p.x + (Math.random() * 16 - 8))); p.el.classList.toggle("gauche", nx < p.x); p.x = nx; p.el.classList.add("marche"); p.el.style.transition = "left 1.6s ease-in-out"; p.pose(); setTimeout(() => p.el.classList.remove("marche"), 1600); } }, 2400);
  $("#bSortir").addEventListener("click", sortir);
  $("#bTele").addEventListener("click", () => ouvrirAnnonce(cle));
  $("#bRegarder").addEventListener("click", () => ouvrirAnnonce(cle));
  $("#bPatron").addEventListener("click", () => { $("#bSous").innerHTML = `<div class="sous-titre">${GENS[B.patron].nom} : ${B.dit}</div>`; const fini = () => setTimeout(() => { const z = $("#bSous"); if (z) z.innerHTML = ""; }, B.voix ? 300 : 3500); if (B.voix) parler(B.voix, $("#bPatron"), fini); else fini(); });
  $("#bLib")?.addEventListener("click", () => { if (spect) return toast("tonFantome", "Libère d’abord ton fantôme", "Dans la rue : « Libérer mon fantôme »."); etat.famille.add(cle); toast(moi(), "Tu fais partie de la famille 🎉", `${B.nom} te préviendra de ses places libres en premier.`); entrer(cle, true); });
  const garde = (f) => () => (spect ? toast("tonFantome", "En spectateur, tu regardes", "Libère ton fantôme pour participer.") : f());
  $("#fQuestion").addEventListener("click", garde(() => feuilleQuestion(cle)));
  $("#fReserver").addEventListener("click", garde(() => feuilleReserver(cle)));
  $("#fAvis").addEventListener("click", garde(() => feuilleAvis(cle)));
  $("#fMot").addEventListener("click", garde(() => feuilleMot(cle)));
  $("#fInviter").addEventListener("click", garde(() => feuilleInviter(cle, "sa boutique")));
  $("#fMur").addEventListener("click", () => feuilleMur(cle));
}
function sortir() {
  clearInterval(mInt); etat.boutique = null; $("#boutique").hidden = true; $("#boutique").innerHTML = ""; Son.niveau(1);
  etat.zoomPorte = null; MONDE().classList.remove("part"); // la caméra recule : on ressort dans la rue
}
// la photo de l'intérieur, cadrée sous l'en-tête ; la télé posée sur un vrai mur (ses 4 coins), dans sa perspective
function poserScene() {
  const e = $("#boutique"), sc = $("#scene"); if (!sc || !etat.boutique) return;
  const I = BOUTIQUES[etat.boutique].int, haut = e.querySelector(".p-haut").getBoundingClientRect().bottom - e.getBoundingClientRect().top + 4;
  // la pièce occupe le haut de l'écran (60 % sur téléphone, 74 % sur ordinateur) ; jamais plus grande que 1,5 fois la photo
  const AW = e.clientWidth, AH = e.clientHeight, couche = AW > AH;
  let bh = Math.min(AH - haut, AH * (couche ? 0.74 : 0.6)), bw = Math.min(AW, (bh * I.iw) / I.ih);
  if (bw > AW * 0.8) bw = AW;
  let k = Math.max(bw / I.iw, bh / I.ih);
  if (k > 1.5) { k = 1.5; bw = Math.min(bw, I.iw * k); bh = Math.min(bh, I.ih * k); }
  const w = I.iw * k, h = I.ih * k;
  Object.assign(sc.style, { width: bw + "px", height: bh + "px", left: (AW - bw) / 2 + "px", top: haut + "px" });
  const f = sc.querySelector(".int-fond"); Object.assign(f.style, { inset: "auto", width: w + "px", height: h + "px", left: -(w - bw) * I.cadre[0] + "px", top: -(h - bh) * I.cadre[1] + "px" });
  sc.classList.add("fondu");
  const ox = -(w - bw) * I.cadre[0], oy = -(h - bh) * I.cadre[1];
  const q = I.tele.map(([x, y]) => [ox + (x / 100) * w, oy + (y / 100) * h]), tw = (dist(q[0], q[1]) + dist(q[3], q[2])) / 2, th = (dist(q[0], q[3]) + dist(q[1], q[2])) / 2;
  const t = $("#bTele"); t.style.width = tw + "px"; t.style.height = th + "px"; t.style.transform = matrice(tw, th, ...q);
  const r = $("#bRegarder"); r.style.left = (q[2][0] + q[3][0]) / 2 + "px"; r.style.top = Math.max(q[2][1], q[3][1]) + 10 + "px";
}
// le commerçant t'accueille par ton prénom (sa vraie voix, enregistrée, la première fois ; ensuite un signe)
function accueillir(cle) {
  const tag = $("#bPatron .tag"); if (etat.boutique !== cle || !tag) return;
  const B = BOUTIQUES[cle]; tag.classList.add("salue"); tag.textContent = `👋 Bienvenue ${PRENOM} !`;
  const fin = () => { const t = $("#bPatron .tag"); if (t && etat.boutique === cle) { t.classList.remove("salue"); t.textContent = `🔊 ${GENS[B.patron].nom}`; } };
  if (!etat.accueillis.has(cle)) { etat.accueillis.add(cle); setTimeout(() => { if (etat.boutique !== cle) return; fin(); $("#bPatron")?.click(); }, 1700); } else setTimeout(fin, 3200);
}

// ── LES FEUILLES ───────────────────────────────────────────────────────────────────────────────
function feuille(html) {
  $("#feuilles").innerHTML = `<div class="voile" id="voile"></div><div class="feuille" role="dialog">${html}<button class="x" type="button" id="fx" aria-label="Fermer">✕</button></div>`;
  $("#voile").addEventListener("click", fermerFeuille); $("#fx").addEventListener("click", fermerFeuille);
}
function fermerFeuille() { $("#feuilles").innerHTML = ""; }
function feuilleQuestion(cle) {
  const B = BOUTIQUES[cle], [q, choix, votes] = B.question;
  const rendu = () => {
    const a = etat.votes[cle], v = votes.map((n, i) => n + (a === i ? 1 : 0)), tot = v.reduce((x, y) => x + y, 0);
    return choix.map((c, i) => `<button type="button" data-i="${i}" class="${a === i ? "moi" : ""}"><i style="width:${a === undefined ? 0 : Math.round((v[i] / tot) * 100)}%"></i><span>${c}</span><span>${a === undefined ? "" : Math.round((v[i] / tot) * 100) + " %"}</span></button>`).join("");
  };
  feuille(`<h3>${GENS[B.patron].nom} demande : ${q}</h3><p class="sous">${votes.reduce((x, y) => x + y, 0)} réponses de sa famille aujourd’hui. ${GENS[B.patron].nom} lit tout.</p><div class="sondage${etat.votes[cle] !== undefined ? " vote" : ""}" id="sondage">${rendu()}</div>`);
  if (etat.votes[cle] !== undefined) return;
  document.querySelectorAll("#sondage button").forEach((b) => b.addEventListener("click", () => {
    if (etat.votes[cle] !== undefined) return;
    etat.votes[cle] = +b.dataset.i; const s = $("#sondage"); s.classList.add("vote"); s.innerHTML = rendu();
    plusTard(6000, { k: B.patron, titre: `${GENS[B.patron].nom} a lu ta réponse`, texte: `« ${choix[etat.votes[cle]]}, c’est noté ! Je te tiens au courant 😉 »`, b: cle });
  }));
}
function feuilleReserver(cle) {
  const B = BOUTIQUES[cle];
  if (etat.pris.has(cle)) return feuille(`<h3>C’est déjà à toi ✓</h3><p class="sous">${B.reserver.quoi}, ${chez(B.nom)}.</p>`);
  etat.pris.add(cle); let reste = 300;
  feuille(`<h3>${B.reserver.quoi[0].toUpperCase() + B.reserver.quoi.slice(1)} est à toi !</h3><p class="sous">Gardée 5 minutes. Au comptoir, ta visite est notée : ta figurine de l’édition Automne de ${B.nom} t’attend.</p><span class="chrono" id="chrono">5:00</span>`);
  const ch = setInterval(() => { const el = $("#chrono"); if (!el) return clearInterval(ch); reste--; el.textContent = `${Math.floor(reste / 60)}:${String(reste % 60).padStart(2, "0")}`; }, 1000);
}
function feuilleMot(cle) {
  const B = BOUTIQUES[cle];
  feuille(`<h3>Un mot à ${GENS[B.patron].nom}</h3><p class="sous">Il s’affiche sur le mur des mots de ${B.nom} ; ${GENS[B.patron].nom} peut te répondre.</p><textarea id="fTexte" maxlength="140" placeholder="Merci pour l’accueil !"></textarea><button class="envoyer" type="button" id="fEnvoyer" disabled>Laisser mon mot</button>`);
  const t = $("#fTexte"); t.focus(); t.addEventListener("input", () => ($("#fEnvoyer").disabled = !t.value.trim()));
  $("#fEnvoyer").addEventListener("click", () => { (etat.mesMots[cle] ||= []).push(t.value.trim()); fermerFeuille(); toast(moi(), "Ton mot est sur le mur", B.nom); plusTard(6000, { k: B.patron, titre: `${GENS[B.patron].nom} t’a répondu`, texte: `« ${B.reponse} »`, b: cle }); });
}
function feuilleMur(cle) {
  const B = BOUTIQUES[cle], mots = [...B.traces, ...(etat.mesMots[cle] || []).map((t) => [moi(), t])];
  feuille(`<h3>Le mur des mots</h3><p class="sous">${B.nom}</p><ul class="boite">${mots.map(([k, t]) => `<li><img src="${GENS[k].n}" alt=""><span><b>${GENS[k].nom}</b><span>${t}</span></span></li>`).join("")}</ul>`);
}
function feuilleInviter(cle, quoi) {
  const B = BOUTIQUES[cle];
  feuille(`<h3>Montrer à un ami</h3><p class="sous">Il voit ${quoi} de ${B.nom} avec ce que les autres en disent, et te répond.</p>
    <div class="amis">${["hugo", "ines", "sam", "lea"].map((k) => `<button class="ami" type="button" data-k="${k}" aria-pressed="false"><img src="${GENS[k].n}" alt=""><b>${GENS[k].nom}</b></button>`).join("")}</div>
    <textarea id="fTexte" maxlength="140">Regarde ça ! T’en penses quoi ? On y va ?</textarea><button class="envoyer" type="button" id="fEnvoyer" disabled>Envoyer</button>`);
  let choisi = null;
  document.querySelectorAll(".ami").forEach((a) => a.addEventListener("click", () => { choisi = a.dataset.k; document.querySelectorAll(".ami").forEach((x) => x.setAttribute("aria-pressed", String(x === a))); $("#fEnvoyer").disabled = false; }));
  $("#fEnvoyer").addEventListener("click", () => {
    fermerFeuille(); toast(choisi, `Envoyé à ${GENS[choisi].nom}`, "Tu seras prévenu·e de sa réponse.");
    const reps = { hugo: "Trop bien ! On y va samedi ?", ines: "Ah oui, ça a l’air top 😍 Je viens !", sam: "Je connais, c’est génial. Je t’accompagne !", lea: "Fonce, tu vas adorer 😋" };
    plusTard(7000, { k: choisi, titre: `${GENS[choisi].nom} t’a répondu`, texte: `« ${reps[choisi]} »`, b: cle, apres: () => (etat.invites[cle] = choisi) });
  });
}
function feuilleAvis(cle) {
  const B = BOUTIQUES[cle];
  feuille(`<h3>Ton avis sur ${B.essai.quoi}</h3><p class="sous">${GENS[B.essai.k].nom} l’a essayé (${B.essai.note}). Ton avis apparaît sous son annonce.</p><div class="puces">${["😋 J’ai adoré", "🙂 Pas mal", "🤔 Pas encore essayé", "😕 Bof"].map((t) => `<button class="puce" type="button">${t}</button>`).join("")}</div>`);
  document.querySelectorAll(".puce").forEach((p) => p.addEventListener("click", () => { fermerFeuille(); toast(moi(), "Ton avis est sous son annonce", `${p.textContent} · ${B.nom}`); plusTard(5000, { k: B.essai.k, titre: `${GENS[B.essai.k].nom} a aimé ton avis ❤️`, texte: "« On y retourne ensemble ? »", b: cle }); }));
}
function feuilleAbsent(k, trace) {
  const nom = GENS[k].nom;
  feuille(`<h3>${nom} n’est pas là</h3><p class="sous">C’est ici qu’on croise ${nom} d’habitude. Son dernier mot : « ${trace || "…"} »</p><textarea id="fTexte" maxlength="140" placeholder="Un petit mot pour ${nom}…"></textarea><button class="envoyer" type="button" id="fEnvoyer" disabled>Laisser un mot à ${nom}</button>`);
  const t = $("#fTexte"); t.addEventListener("input", () => ($("#fEnvoyer").disabled = !t.value.trim()));
  $("#fEnvoyer").addEventListener("click", () => { fermerFeuille(); toast(k, `${nom} le verra en revenant`, "Ton mot l’attend."); plusTard(9000, { k, titre: `${nom} a lu ton mot`, texte: "« Merci ! On se voit en ville ? 😊 »", b: k === "sam" ? "atelier" : "alice" }); });
}
function feuilleDiscussion(k, p) {
  const nom = GENS[k].nom, questions = ["Tu recommandes ?", "C’était comment ?", "On y va ensemble ?"];
  const reps = { "Tu recommandes ?": "Carrément, les yeux fermés !", "C’était comment ?": "Génial, l’accueil est adorable 💛", "On y va ensemble ?": "Avec plaisir ! Samedi, ça te va ?" };
  feuille(`<h3>${nom}</h3><p class="sous">${nom} est en ville en ce moment et a choisi d’être visible.</p><div class="fil-discu" id="fDiscu"><div class="dit lui">${(PAROLES[k] || ["Coucou !"])[0]}</div></div><div class="puces">${questions.map((q) => `<button class="puce" type="button">${q}</button>`).join("")}</div>`);
  document.querySelectorAll(".puce").forEach((b) => b.addEventListener("click", () => {
    const f = $("#fDiscu"); f.insertAdjacentHTML("beforeend", `<div class="dit moi">${b.textContent}</div><div class="dit lui ecrit" id="ecrit">${nom} écrit…</div>`);
    setTimeout(() => { $("#ecrit")?.remove(); f.insertAdjacentHTML("beforeend", `<div class="dit lui">${reps[b.textContent]}</div>`); if (k === "lea" && b.textContent === "Tu recommandes ?") parler("lea-magret", p?.el || null); }, 1400);
  }));
  if (p) bulle(p, `<small>${nom}</small>${(PAROLES[k] || ["Coucou !"])[0]}`);
}
function feuilleBoite() {
  feuille(`<h3>Ta boîte</h3><p class="sous">Ce qui t’attend en ville</p><ul class="boite">${etat.boite.map((m, i) => `<li data-i="${i}" class="${m.neuf ? "neuf" : ""}"><img src="${GENS[m.k].n}" alt=""><span><b>${m.titre}</b><span>${m.texte}</span><small>${m.le} · ${BOUTIQUES[m.b].nom} ›</small></span></li>`).reverse().join("")}</ul><p class="regle">Dans le vrai ClikMe : seulement de vraies réponses, de vraies personnes.</p>`);
  etat.boite.forEach((m) => (m.neuf = false)); majBoite();
  document.querySelectorAll(".boite li[data-i]").forEach((li) => li.addEventListener("click", () => { const m = etat.boite[+li.dataset.i]; fermerFeuille(); fermerAnnonce(); entrer(m.b); }));
}
function majBoite() {
  const n = etat.boite.filter((m) => m.neuf).length;
  document.querySelectorAll(".nbBoite").forEach((e) => { e.textContent = n; e.hidden = !n; });
  document.querySelectorAll(".boiteIci").forEach((b) => { if (!b.dataset.lie) { b.dataset.lie = "1"; b.addEventListener("click", feuilleBoite); } });
}
function toast(k, titre, texte, auClic) {
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = `<img src="${GENS[k].n}" alt=""><span><b>${titre}</b><span>${texte}</span></span>`;
  if (auClic) d.addEventListener("click", () => { d.remove(); auClic(); });
  $("#toasts").innerHTML = ""; $("#toasts").appendChild(d); setTimeout(() => d.remove(), 4200);
}
function plusTard(ms, m) {
  setTimeout(() => {
    m.le = "à l’instant"; m.neuf = true; etat.boite.push(m); m.apres?.(); majBoite();
    document.querySelectorAll("#boite,.boiteIci").forEach((b) => { b.classList.remove("sonne"); void b.offsetWidth; b.classList.add("sonne"); });
    toast(m.k, "🔔 " + m.titre, m.texte, feuilleBoite);
  }, ms);
}

$("#boite").addEventListener("click", feuilleBoite);
$("#musique").addEventListener("click", () => { const on = Son.basculer(); $("#musique").textContent = on ? "🎵" : "🔈"; });
function entrerDansDax(mode) {
  const p = $("#porte"); if (p.classList.contains("ouvre")) return;
  etat.mode = mode; p.classList.add("ouvre"); Son.demarrer(); lieu();
  if (mode !== "spectateur") setTimeout(() => toast("lea", "🔔 Léa te demande ton avis", "« Tu as déjà goûté le magret de Chez Bergine ? »", feuilleBoite), 2600);
}
$("#avecFigurine").addEventListener("click", () => entrerDansDax("figurine"));

let tRetaille;
window.addEventListener("resize", () => { clearTimeout(tRetaille); tRetaille = setTimeout(() => {
  if ($("#app").clientWidth === VW && $("#app").clientHeight === VH) return;
  lieu({ toi: toi && { x: toi.x, y: toi.y }, gens: Object.fromEntries(gens.filter((p) => p.la && !p.passant).map((p) => [p.k, { x: p.x, y: p.y }])) }); poserScene();
}, 150); });
lieu(); majBoite(); requestAnimationFrame(boucle);
// les présents parlent de temps en temps, un à la fois
setInterval(() => {
  if (!$("#porte").classList.contains("ouvre") || !$("#plein").hidden || !$("#boutique").hidden || !$("#carte").hidden || $("#feuilles").innerHTML) return;
  if (auSeuil) return; // un commerçant parle sur le pas de sa porte : on ne lui coupe pas la parole
  const la = gens.filter((p) => p.la && PAROLES[p.k] && visible(p)); if (!la.length) return;
  const p = la[Math.floor(Math.random() * la.length)];
  bulle(p, `<small>${GENS[p.k].nom}</small>${PAROLES[p.k][Math.floor(Math.random() * PAROLES[p.k].length)]}`);
}, 4300);
