<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ═══ FACE AU FANTÔME — UN ÉPISODE, IMAGE PAR IMAGE ═══════════════════════
   dessiner(t) dessine l'image de l'instant t ; mixer() fabrique le son.
   Tout est fonction du temps : le même t donne toujours la même image. */
// LE FANTÔME POSE SES QUESTIONS À VOIX HAUTE : chaque carte s'allonge du temps de sa question,
// et tout ce qui suit glisse d'autant. Les temps écrits plus bas sont ceux de la première version.
const D1 = 1.13, D2 = 1.24, D3 = 0.49;
const tt = (t) => t + (t >= 6.75 ? D1 : 0) + (t >= 18.25 ? D2 : 0) + (t >= 27.95 ? D3 : 0);
const W = 1080, H = 1920, DUREE = tt(39.5);
const ROSE = "#FF2E9A", CREME = "#FFF4E6", NUIT = "#140C09";
const c = document.getElementById("c");
let g = c.getContext("2d");
const IM = {}, SON = {};
let MOTS, GRAIN;

/* ─── LES OUTILS ─── */
const borne = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sortie = (x) => 1 - Math.pow(1 - borne(x), 3);
const douce = (x) => { x = borne(x); return x * x * (3 - 2 * x); };
const rebond = (x) => { x = borne(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, x) => a + (b - a) * x;
function hasard(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function toile(w, h) { const t = document.createElement("canvas"); t.width = w; t.height = h; return t; }
function flou(img, r) {
  const t = toile(img.width, img.height), x = t.getContext("2d");
  x.filter = `blur(${r}px)`; x.drawImage(img, 0, 0); return t;
}
function fabriquerGrain() {
  const t = toile(540, 960), x = t.getContext("2d"), d = x.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hasard(i) - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return t;
}

/** Une image qui couvre l'écran : (fx, fy) le point de l'image au point (tx, ty) de l'écran, z le zoom. */
function couvrir(img, { fx = 0.5, fy = 0.5, z = 1, tx = 0.5, ty = 0.5, ctx = g, w = W, h = H } = {}) {
  const iw = img.width, ih = img.height;
  const s = Math.max(w / iw, h / ih) * z, dw = iw * s, dh = ih * s;
  let x = w * tx - fx * dw, y = h * ty - fy * dh;
  x = Math.min(0, Math.max(w - dw, x)); y = Math.min(0, Math.max(h - dh, y));
  ctx.drawImage(img, x, y, dw, dh);
}
/** Le flou de zoom : la même image, plusieurs fois, de plus en plus grande. */
function flouDeZoom(img, o, force) {
  const n = 7;
  for (let k = 1; k <= n; k++) { g.globalAlpha = 0.16 * force; couvrir(img, { ...o, z: o.z * (1 + 0.035 * k * force) }); }
  g.globalAlpha = 1;
}
function etalonner(chaleur = 0.22) {
  g.save();
  g.globalCompositeOperation = "soft-light"; g.fillStyle = `rgba(255,150,70,${chaleur})`; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over";
  const v = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.48, H * 0.82);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.6)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.restore();
}
function lueur(x, y, r, couleur) {
  const d = g.createRadialGradient(x, y, 0, x, y, r);
  d.addColorStop(0, couleur); d.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = d; g.fillRect(0, 0, W, H);
}
/** La vapeur : des volutes douces qui montent — lentement au ralenti. */
function vapeur(t, x0, y0, largeur, vitesse = 1, force = 1) {
  g.save(); g.globalCompositeOperation = "screen";
  for (let k = 0; k < 26; k++) {
    const ph = (t * 0.22 * vitesse + hasard(k) ) % 1;
    const x = x0 + (hasard(k + 7) - 0.5) * largeur + Math.sin(t * 0.9 * vitesse + k) * 26 + ph * 40 * (hasard(k + 3) - 0.5);
    const y = y0 - ph * 620;
    const r = 50 + ph * 170;
    const a = 0.13 * Math.sin(Math.PI * ph) * force;
    const d = g.createRadialGradient(x, y, 0, x, y, r);
    d.addColorStop(0, `rgba(255,248,240,${a})`); d.addColorStop(1, "rgba(255,248,240,0)");
    g.fillStyle = d; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  g.restore();
}
/** La traînée de lumière rose qui balaie l'image (fuite de lumière). */
function fuite(u, force = 1) {
  if (u < 0 || u > 1) return;
  g.save(); g.globalCompositeOperation = "screen";
  const x = mix(-300, W + 300, sortie(u)), a = Math.sin(Math.PI * u) * 0.55 * force;
  const d = g.createRadialGradient(x, H * 0.4, 0, x, H * 0.4, 700);
  d.addColorStop(0, `rgba(255,70,160,${a})`); d.addColorStop(0.5, `rgba(255,140,60,${a * 0.5})`); d.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = d; g.fillRect(0, 0, W, H);
  g.restore();
}
function rectArrondi(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function texte(t, x, y, police, couleur, { align = "left", ls = 0, ombre = 0, contour = 0 } = {}) {
  g.save(); g.font = police; g.textAlign = align; g.textBaseline = "alphabetic"; g.letterSpacing = `${ls}px`;
  if (ombre) { g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = ombre; g.shadowOffsetY = ombre / 4; }
  if (contour) { g.lineJoin = "round"; g.lineWidth = contour; g.strokeStyle = "rgba(0,0,0,.82)"; g.strokeText(t, x, y); }
  g.fillStyle = couleur; g.fillText(t, x, y); g.restore();
}
function largeurTexte(t, police, ls = 0) { g.save(); g.font = police; g.letterSpacing = `${ls}px`; const w = g.measureText(t).width; g.restore(); return w; }

/* ═══ LA VOIX : SES MOTS, À LEUR PLACE DANS L'ÉPISODE ═══════════════════ */
// [début, fin] dans l'enregistrement de Jean-Marie, et l'instant T où il passe dans l'épisode.
const CLIPS = [
  { id: "hook", src: [24.915, 26.73], T: 0.3, style: "accroche" },
  { id: "a", src: [1.76, 2.95], T: tt(6.85) },
  { id: "b", src: [3.57, 5.87], T: tt(8.2) },
  { id: "c", src: [6.56, 9.08], T: tt(10.8) },
  { id: "d", src: [9.48, 12.47], T: tt(13.62) },
  { id: "e", src: [13.23, 18.25], T: tt(18.35) },
  { id: "f", src: [18.97, 21.05], T: tt(23.75) },
  { id: "g", src: [21.75, 22.98], T: tt(28.0) },
  { id: "h", src: [23.29, 24.12], T: tt(29.5) },
  { id: "i", src: [24.67, 26.73], T: tt(30.75) },
];
const FORTS = /quadriller|croustillante|graisse|canard|tranche|odeur/i;
const FRAPPES = /^(croustillant,|fondant…|l'odeur)$/;
let MOTS_EP = [], MORCEAUX = [], FRAPPES_EP = [];
function preparerMots() {
  const tous = Object.values(MOTS).flatMap((p) => p.mots);
  for (const cl of CLIPS) {
    const L = tous.filter((w) => w.a >= cl.src[0] - 0.02 && w.b <= cl.src[1] + 0.06).map((w) => ({ m: w.m, a: cl.T + w.a - cl.src[0], b: cl.T + w.b - cl.src[0] }));
    if (cl.id === "i") L.unshift({ m: "et", a: cl.T, b: cl.T + 0.245 });
    if (cl.id === "a") L[0].m = "Mon";
    if (cl.id === "hook") L[0].m = "L'odeur";
    for (const w of L) { w.fort = FORTS.test(w.m); w.clip = cl.id; w.style = cl.style || "normal"; }
    const frappes = cl.id === "g" || cl.id === "h" || cl.id === "i" ? L.filter((w) => FRAPPES.test(w.m)) : [];
    FRAPPES_EP.push(...frappes);
    const reste = L.filter((w) => !frappes.includes(w));
    // des morceaux de deux à quatre mots, coupés à la ponctuation, ou là où un mot frappe
    let cur = [];
    const pousser = () => { if (cur.length) MORCEAUX.push(cur); cur = []; };
    for (let k = 0; k < reste.length; k++) {
      const w = reste[k], prev = cur[cur.length - 1];
      const longueur = cur.map((x) => x.m).join(" ").length + w.m.length;
      const trou = prev && w.a - prev.b > 0.35;
      if (cur.length && (longueur > (cl.style === "accroche" ? 22 : 17) || trou || /[,.…]$/.test(prev.m))) pousser();
      cur.push(w);
    }
    pousser();
    MOTS_EP.push(...L);
  }
  // fin de chaque morceau : le suivant, ou un souffle après son dernier mot
  for (let k = 0; k < MORCEAUX.length; k++) {
    const m = MORCEAUX[k], suiv = MORCEAUX[k + 1];
    m.de = m[0].a - 0.06;
    m.fin = Math.min(m[m.length - 1].b + 0.32, suiv && suiv[0].clip === m[0].clip ? suiv[0].a - 0.06 : 99);
  }
  FRAPPES_EP.sort((a, b) => a.a - b.a);
  FRAPPES_EP.forEach((w, k) => { w.fin = k < FRAPPES_EP.length - 1 ? Math.min(FRAPPES_EP[k + 1].a - 0.25, w.a + 0.95) : w.a + 0.62; });
}

/* ─── LES SOUS-TITRES MOT À MOT ─── */
function sousTitres(t) {
  const m = MORCEAUX.find((x) => t >= x.de && t < x.fin);
  if (!m) return;
  const acc = m[0].style === "accroche";
  const taille = acc ? 96 : 84;
  const police = `900 ${taille}px Poppins`;
  const esp = largeurTexte(" ", police) + taille * 0.16;
  // une ou deux lignes
  const largeurs = m.map((w) => largeurTexte(w.m, police));
  let lignes = [m.map((_, k) => k)];
  const total = largeurs.reduce((s, x) => s + x, 0) + esp * (m.length - 1);
  if (total > 940) { const coupe = Math.ceil(m.length / 2); lignes = [m.slice(0, coupe).map((_, k) => k), m.slice(coupe).map((_, k) => k + coupe)]; }
  const yBas = acc ? 1420 : 1385, pas = taille * 1.12;
  lignes.forEach((ligne, li) => {
    const lw = ligne.reduce((s, k) => s + largeurs[k], 0) + esp * (ligne.length - 1);
    let x = W / 2 - lw / 2;
    const y = yBas - (lignes.length - 1 - li) * pas;
    for (const k of ligne) {
      const w = m[k], dt = t - (w.a - 0.04);
      if (dt >= 0) {
        const s = 0.72 + 0.28 * rebond(dt / 0.14);
        const courant = t >= w.a && t < w.b + 0.04;
        g.save(); g.translate(x + largeurs[k] / 2, y - taille * 0.35); g.scale(s * (courant ? 1.07 : 1), s * (courant ? 1.07 : 1));
        texte(w.m, -largeurs[k] / 2, taille * 0.35, police, courant || w.fort ? ROSE : "#FFFFFF", { contour: 16, ombre: 24 });
        g.restore();
      }
      x += largeurs[k] + esp;
    }
  });
}
/** LES MOTS QUI FRAPPENT : « CROUSTILLANT », « FONDANT », « L'ODEUR » — en plein écran. */
function frappes(t) {
  for (const w of FRAPPES_EP) {
    const u = t - w.a;
    if (u < 0 || t > w.fin) continue;
    const mot = w.m.replace(/[,.…]/g, "").toUpperCase();
    let taille = 320; while (largeurTexte(mot, `${taille}px Anton`, 4) > 960) taille -= 8;
    const s = u < 0.12 ? mix(1.9, 1, sortie(u / 0.12)) : 1 + 0.05 * (u - 0.12);
    const a = Math.min(1, u / 0.05, (w.fin - t) / 0.12);
    g.save(); g.globalAlpha = borne(a); g.translate(W / 2, H * 0.5); g.scale(s, s);
    texte(mot, 0, taille * 0.36, `${taille}px Anton`, ROSE, { align: "center", ls: 4, ombre: 40 });
    g.restore();
  }
}
function secousse(t) {
  for (const w of FRAPPES_EP) { const u = t - w.a; if (u >= 0 && u < 0.2) return [Math.sin(u * 140) * 16 * (1 - u / 0.2), Math.cos(u * 110) * 10 * (1 - u / 0.2)]; }
  return [0, 0];
}

/* ═══ LES PLANS ════════════════════════════════════════════════════════ */
const QUESTIONS = {
  1: { num: "QUESTION 1 / 3", l1: "TON", l2: "GESTE", sous: ["Montre-moi le geste", "qui fait la différence."] },
  2: { num: "QUESTION 2 / 3", l1: "TON", l2: "SECRET", sous: ["Et c'est quoi, ton secret,", "pour qu'il soit si bon ?"] },
  3: { num: "DERNIÈRE QUESTION · LE DÉFI", l1: "TON PLAT", l2: "EN 3 MOTS", sous: ["Trois mots,", "pas un de plus."], defi: true },
};
// CE QUE DIT LE FANTÔME, ET QUAND : ses questions sur les cartes, son au revoir sur la carte de fin.
// Sa voix : les répliques enregistrées sur ElevenLabs (voir `voix-fantome/`).
const PAROLES_REPORTER = [
  { id: "q1", src: "a/f-q1.mp3", T: 5.62 },
  { id: "q2", src: "a/f-q2.mp3", T: tt(16.75) + 0.27 },
  { id: "derniere", src: "a/f-derniere.mp3", T: tt(25.95) + 0.15 },
  { id: "defi", src: "a/f-defi.mp3", T: tt(25.95) + 1.3 },
  { id: "ademain", src: "a/f-ademain.mp3", T: tt(34.3) },
];
function boucheReporter(t) {
  for (const p of PAROLES_REPORTER) {
    const env = SON[p.id + "Env"]; if (!env) continue;
    const i = Math.floor((t - p.T) * 30);
    if (i >= 0 && i < env.length) return env[i];
  }
  return 0;
}
function reporter(x, y, s, t, apparition) {
  const o = boucheReporter(t), k = o > 0.55 ? 3 : o > 0.3 ? 2 : o > 0.08 ? 1 : 0;
  const img = IM["r" + k], sc = s * rebond(apparition);
  if (apparition <= 0) return;
  g.save(); g.translate(x, y + Math.sin(t * 2.6) * 8); g.rotate(Math.sin(t * 1.7) * 0.03); g.scale(sc, sc);
  g.drawImage(img, -img.width / 2, -img.height, img.width, img.height); g.restore();
}

function carteQuestion(n, u, t) {
  const q = QUESTIONS[n];
  g.fillStyle = NUIT; g.fillRect(0, 0, W, H);
  lueur(880, 1560, 1000, "rgba(255,46,154,.42)");
  lueur(120, 260, 760, "rgba(255,150,60,.18)");
  // les rayures du plateau
  g.save(); g.globalAlpha = 0.06; g.strokeStyle = CREME; g.lineWidth = 2;
  for (let k = -20; k < 40; k++) { g.beginPath(); g.moveTo(k * 70 + u * 60, 0); g.lineTo(k * 70 - 600 + u * 60, H); g.stroke(); }
  g.restore();
  const entre = (d) => sortie((u - d) / 0.3);
  texte(q.num, 84, 560 - 30 * (1 - entre(0.05)), "800 34px Poppins", ROSE, { ls: 7 });
  const t1 = `${q.l1}`, t2 = `${q.l2}`;

    dessinerDans(avant, () => dessinerSeg(k - 1, SEGS[k - 1].a - 0.001));

    const e = sortie((u - (s.a - s.de - 0.2)) / 0.2);
    dessinerSeg(k + 1, SEGS[k + 1].de);
    const carte = toile(W, H); dessinerDans(carte, () => dessinerSeg(k, t));

  } else dessinerSeg(k, t);

const SR = 48000;
async function decoder(url) { const b = await (await fetch(url)).arrayBuffer(); return await new OfflineAudioContext(1, SR, SR).decodeAudioData(b); }

  const d = buf.getChannelData(0), pas = Math.floor(buf.sampleRate / ips), out = [];
  let m = 0;
  for (let i = 0; i < d.length; i += pas) { let s = 0; for (let j = i; j < Math.min(d.length, i + pas); j++) s += d[j] * d[j]; const r = Math.sqrt(s / pas); out.push(r); m = Math.max(m, r); }
  return out.map((r) => r / m);
}
function picDe(b) { const d = b.getChannelData(0); let p = 0; for (let i = 0; i < d.length; i++) p = Math.max(p, Math.abs(d[i])); return p; }
