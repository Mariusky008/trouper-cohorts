<title>La rue de Dax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Poppins:wght@500;700;800&display=swap">
<style>
/* Une scène de rue en carte postale animée : le décor fixe, les figurines posées sur les pavés, l'interface en verre fumé
   par-dessus. Un seul monde, sombre autour, lumineux dedans : le thème du visiteur ne change rien. */
:root{
  --rose:#FF2E9A;--rose-doux:#FF8FCB;--or:#F2C46B;--encre:#2A1622;--papier:#FFF8EF;--papier-2:#F3E7DA;
  --verre:rgba(32,14,26,.74);--verre-bord:rgba(255,255,255,.16);--creme:#FFF4E6;--doux:#D9C3CB;--nuit:#160A12;
  --affiche:"Grandstander","Comic Neue",ui-rounded,system-ui,sans-serif;
  --texte:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--nuit);color:var(--creme);font-family:var(--texte);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:grid;place-items:center;overflow:hidden}
.flou{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(22px) brightness(.45);transition:background-image .6s}
.scene{position:relative;height:min(100%,calc(100vw * 1024 / 572));aspect-ratio:572/1024;max-width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);touch-action:pan-y;user-select:none}
@media (min-width:600px){.scene{border-radius:28px}}
.decor{position:absolute;inset:0;background:center/cover no-repeat;transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
.decor.sort{opacity:0}
#calque{position:absolute;inset:0;z-index:1} /* sa propre pile : les figurines (rangées par profondeur) restent sous l'interface */
/* ── les figurines : posées par les pieds, plus grandes devant ── */
.perso{position:absolute;transform:translate(-50%,-100%);transition:left 1.1s cubic-bezier(.45,0,.3,1),top 1.1s cubic-bezier(.45,0,.3,1),height 1.1s cubic-bezier(.45,0,.3,1);cursor:pointer;z-index:2;background:none;border:0;padding:0}
.perso img{display:block;height:100%;width:auto;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));transform-origin:50% 100%;animation:respire 3.2s ease-in-out infinite}
.perso:nth-child(2n) img{animation-delay:-1.3s}
.perso::after{content:"";position:absolute;left:18%;right:18%;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.38),transparent 70%);z-index:-1}
.perso.marche img{animation:dandine .32s ease-in-out infinite}
.perso.toi img{filter:drop-shadow(0 0 10px rgba(242,196,107,.55)) drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.perso:focus-visible{outline:3px solid var(--or);outline-offset:4px;border-radius:12px}
.etiquette{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);white-space:nowrap;padding:2px 9px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);font-size:10.5px;font-weight:700;color:var(--creme)}
.toi .etiquette{background:var(--rose);border-color:transparent}
@keyframes respire{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3%) scaleY(1.015)}}
@keyframes dandine{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4%)}}
/* ── les bulles ── */
.bulle{position:absolute;z-index:5;max-width:44%;padding:9px 12px 10px;border-radius:16px;background:var(--papier);color:var(--encre);font-family:var(--affiche);font-weight:600;font-size:13px;line-height:1.22;box-shadow:0 10px 24px -8px rgba(0,0,0,.55);transform:translate(-50%,calc(-100% - 12px)) scale(.6);opacity:0;transition:opacity .35s,transform .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.bulle.vue{opacity:1;transform:translate(-50%,calc(-100% - 12px)) scale(1)}
.bulle::after{content:"";position:absolute;left:50%;bottom:-8px;border:9px solid transparent;border-top-color:var(--papier);border-bottom:0;transform:translateX(-50%)}
.bulle small{display:block;margin-bottom:3px;font-family:var(--texte);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9A5A7A}
.bulle.rumeur small{color:#B07A12}
/* ── l'ardoise du commerçant ── */
.ardoise{position:absolute;z-index:3;transform:translate(-50%,-100%);width:21%;padding:6px 6px 8px;border-radius:6px;background:#2E3A33;border:4px solid #8A5A34;box-shadow:0 8px 14px rgba(0,0,0,.4);font-family:var(--affiche);font-weight:600;font-size:11px;line-height:1.15;color:#F4F1E6;text-align:center;cursor:pointer}
.ardoise::before,.ardoise::after{content:"";position:absolute;bottom:-16px;width:4px;height:14px;background:#8A5A34}
.ardoise::before{left:16%}.ardoise::after{right:16%}
.vitrine{position:absolute;z-index:1;border-radius:10px;cursor:pointer;background:none;border:0;padding:0}
.vitrine:focus-visible{outline:3px dashed var(--or)}
.vitrine.repere{animation:repere 1.6s ease-in-out 2}
@keyframes repere{50%{box-shadow:inset 0 0 0 3px rgba(242,196,107,.9),0 0 22px rgba(242,196,107,.6)}}
/* ── l'interface en verre ── */
.haut{position:absolute;z-index:8;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.haut > *{pointer-events:auto}
.moi{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);backdrop-filter:blur(8px);color:var(--creme);font:inherit;cursor:pointer}
.moi-tete{width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,#FFD9A8,#C98A4B) center/cover;border:2px solid var(--or);overflow:hidden;position:relative}
.moi-tete img{position:absolute;left:-28%;top:-6%;width:156%}
.moi b{display:block;font-size:12.5px;line-height:1.1;text-align:left}
.moi small{display:block;font-size:10px;color:var(--doux);text-align:left}
.moi i{display:block;width:84px;height:4px;margin-top:3px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.moi i::before{content:"";display:block;height:100%;width:60%;background:linear-gradient(90deg,var(--rose),var(--or))}
.raconte{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:16px;background:var(--verre);border:1px solid var(--verre-bord);backdrop-filter:blur(8px);color:var(--creme);font:inherit;font-size:12px;font-weight:800;cursor:pointer;position:relative}
.raconte em{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);font-style:normal;font-size:10.5px;display:grid;place-items:center}
.bas{position:absolute;z-index:8;left:10px;right:10px;bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.lieu{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);backdrop-filter:blur(8px)}
.lieu button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--creme);font:inherit;font-size:16px;cursor:pointer}
.lieu span{padding:0 4px;max-width:112px;font-size:10.5px;font-weight:700;text-align:center;line-height:1.15}
.lieu span small{display:block;font-weight:500;color:var(--doux);font-size:9.5px}
.boutons{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.bouton{display:flex;align-items:center;gap:7px;padding:10px 14px;white-space:nowrap;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;color:#fff;background:var(--rose);box-shadow:0 10px 22px -8px rgba(255,46,154,.85)}
.bouton.verre{background:var(--verre);border:1px solid var(--verre-bord);box-shadow:none;backdrop-filter:blur(8px)}
.bouton:focus-visible,.raconte:focus-visible,.moi:focus-visible,.lieu button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.mission-en-cours{position:absolute;z-index:8;left:50%;top:62px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:var(--verre);border:1px solid rgba(242,196,107,.6);backdrop-filter:blur(8px);font-size:12px;font-weight:700;white-space:nowrap}
.mission-en-cours i{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--or);animation:clignote .9s ease-in-out infinite}
@keyframes clignote{50%{opacity:.2}}
.pas{position:absolute;z-index:1;width:14px;height:9px;border-radius:50%;background:rgba(255,236,190,.75);box-shadow:0 0 8px rgba(255,214,120,.9);animation:pas 1.6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes pas{to{opacity:0}}
.maquette{position:absolute;z-index:8;left:50%;top:56px;transform:translateX(-50%);font-size:9.5px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
/* ── la porte d'entrée ── */
.porte{position:absolute;inset:0;z-index:20;background:center/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:18% 16px 12%;cursor:pointer;transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .9s ease-in .25s;transform-origin:50% 52%}
.porte.ouvre{transform:scale(2.6);opacity:0;pointer-events:none}
.porte h1{margin:0;font-family:var(--affiche);font-weight:800;font-size:clamp(34px,11vw,52px);line-height:.95;text-align:center;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.7);text-wrap:balance}
.porte h1 b{color:var(--rose-doux)}
.porte p{margin:0;padding:10px 18px;border-radius:999px;background:var(--verre);border:1px solid var(--verre-bord);font-weight:700;font-size:13.5px;animation:respire 2.4s ease-in-out infinite}
/* ── les feuilles qui montent ── */
.voile{position:absolute;inset:0;z-index:12;background:rgba(10,4,8,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.voile.ouvert{opacity:1;pointer-events:auto}
.feuille{position:absolute;z-index:13;left:0;right:0;bottom:0;max-height:78%;overflow:auto;padding:10px 16px 18px;border-radius:24px 24px 0 0;background:var(--papier);color:var(--encre);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 50px rgba(0,0,0,.45)}
.feuille.ouverte{transform:translateY(0)}
.feuille .poignee{display:block;width:44px;height:5px;margin:0 auto 10px;border-radius:9px;background:#D8C6B6}
.feuille h2{margin:0;font-family:var(--affiche);font-weight:800;font-size:22px;line-height:1.1;text-wrap:balance}
.feuille .sous{margin:3px 0 0;font-size:12.5px;color:#7A6470}
.fermer{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--papier-2);color:var(--encre);font-size:16px;cursor:pointer}
.carte-com{display:flex;gap:12px;align-items:center;margin-top:12px}
.carte-com .fig{flex:none;width:74px;height:90px;border-radius:16px;background:linear-gradient(160deg,#FFA24A,#7C3110);display:grid;place-items:end center;overflow:hidden}
.carte-com .fig img{height:92%;width:100%;object-fit:contain;object-position:bottom}
.bloc{margin-top:12px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid #EADCCD}
.bloc small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9A5A7A}
.bloc b{display:block;margin-top:3px;font-family:var(--affiche);font-size:17px;line-height:1.2}
.bloc span{display:block;margin-top:4px;font-size:11.5px;color:#7A6470}
.bloc.famille{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFF0F7,#FFF6E5);border-color:#F3C6DD}
.bloc.famille.ferme b,.bloc.famille.ferme span{filter:blur(6px);user-select:none}
.bloc.famille .cadenas{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:rgba(255,248,240,.35)}
.bloc.famille.ouvert .cadenas{display:none}
.action{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;border:0;background:var(--rose);color:#fff;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px -8px rgba(255,46,154,.9)}
.action.clair{background:var(--papier-2);color:var(--encre);box-shadow:none}
.action:focus-visible,.fermer:focus-visible,.puce:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.rang{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.puce{padding:8px 12px;border-radius:999px;border:1.5px solid #E2CFC0;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--encre);cursor:pointer}
.puce[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:#fff}
.liste{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.liste li{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid #EADCCD}
.liste li > i{flex:none;font-style:normal;font-size:20px;line-height:1.2}
.liste li b{display:block;font-size:13.5px;line-height:1.3}
.liste li small{display:block;margin-top:3px;font-size:11px;color:#7A6470}
.tag{display:inline-block;margin-bottom:3px;padding:2px 7px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#F1E4F8;color:#6A3A86}
.tag.com{background:#FFE6F2;color:#A1155E}.tag.rech{background:#E3F0FF;color:#1D5B9A}.tag.rum{background:#FFF1D6;color:#8A5A00}.tag.evt{background:#E4F6EC;color:#1E6B41}
.regle{margin:12px 0 0;font-size:11px;line-height:1.4;color:#8D7580}
.collec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.collec div{border-radius:16px;padding:8px 6px 10px;text-align:center;background:#fff;border:1px solid #EADCCD}
.collec div span{display:grid;place-items:end center;height:84px;border-radius:12px;background:linear-gradient(160deg,var(--a,#FFA24A),var(--b,#7C3110));overflow:hidden}
.collec div img{height:90%;width:100%;object-fit:contain;object-position:bottom}
.collec div b{display:block;margin-top:6px;font-size:12px;line-height:1.15}
.collec div small{display:block;font-size:11px;color:#7A6470}
.collec .ombre img{filter:brightness(0);opacity:.45}
.toast{position:absolute;z-index:30;left:50%;bottom:86px;transform:translate(-50%,20px);padding:10px 16px;border-radius:999px;background:var(--encre);color:#fff;font-size:12.5px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.vu{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<div class="app" id="app">
  <div class="flou" id="flou"></div>
  <div class="scene" id="scene" aria-label="La rue de Dax, animée">
    <div class="decor" id="decor"></div>
    <div id="calque"></div>

    <div class="haut">
      <button class="moi" id="moi" type="button" aria-label="Ta figurine : 6 figurines sur 10">
        <span class="moi-tete"><img src="img/detective.webp" alt=""></span>
        <span><b>Toi · ton compagnon</b><small>6 / 10 figurines</small><i></i></span>
      </button>
      <button class="raconte" id="raconte" type="button">📣 On raconte quoi ?<em>4</em></button>
    </div>
    <p class="maquette">Maquette · commerces, prénoms et nouvelles imaginaires</p>
    <div class="mission-en-cours" id="enCours" hidden><i></i>Ton compagnon fait le tour…</div>

    <div class="bas">
      <div class="lieu">
        <button type="button" id="avant" aria-label="Lieu précédent">‹</button>
        <span id="nomLieu">Place de la cathédrale<small>1 / 2 · glisse</small></span>
        <button type="button" id="apres" aria-label="Lieu suivant">›</button>
      </div>
      <div class="boutons">
        <button class="bouton verre" id="collection" type="button">🏆 Ma collection</button>
        <button class="bouton" id="mission" type="button">🔎 Envoyer en mission</button>
      </div>
    </div>

    <div class="porte" id="porte" role="button" tabindex="0" aria-label="Entrer dans la ville">
      <h1>Clik<b>Me</b><br>Dax</h1>
      <p>Touche la porte pour sortir 👣</p>
    </div>

    <div class="voile" id="voile"></div>
    <section class="feuille" id="feuille" aria-live="polite">
      <span class="poignee"></span>
      <button class="fermer" id="fermer" type="button" aria-label="Fermer">✕</button>
      <div id="contenu"></div>
    </section>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
// ── LES DONNÉES DE LA MAQUETTE (tout est imaginaire) ─────────────────────────────────────────
const COMMERCES = {
  pain: { nom: "Au Pain Doré", metier: "Boulangerie", fig: "img/chef.webp", a: "#FFA24A", b: "#7C3110",
    pancarte: "Les premiers croissants sortent du four !", publie: "à 7 h 42",
    famille: "Il me reste 6 chocolatines : elles sont pour la famille jusqu’à 10 h.", collection: [3, 10] },
  grimoire: { nom: "Le Grimoire", metier: "Librairie", fig: "img/libraire.webp", a: "#B98CFF", b: "#3A1A8C",
    pancarte: "Un nouveau roman vient d’arriver 📚", publie: "à 9 h 05",
    famille: "Lecture à voix haute samedi à 10 h : 4 places, pour la famille d’abord.", collection: [2, 10] },
  douceurs: { nom: "Les Douceurs", metier: "Pâtisserie", fig: null, a: "#FFB8D6", b: "#8E1442",
    pancarte: "Tarte aux pommes du jour, encore tiède.", publie: "à 10 h 20",
    famille: "2 parts offertes à la famille avec un café, de 15 h à 16 h.", collection: [1, 10] },
};
// les lieux : leur décor, l'horizon (pour la taille des figurines), qui est là
const LIEUX = [
  { nom: "Place de la cathédrale", decor: "img/place.jpg", horizon: 47,
    vitrines: [{ com: "pain", x: 0, y: 38, w: 24, h: 24 }],
    ardoise: { com: "pain", x: 11, y: 88, texte: "Croissants chauds !" },
    persos: [
      { id: "chef", img: "img/chef.webp", x: 30, y: 71, nom: "Au Pain Doré", com: "pain" },
      { id: "jade", img: "img/exploratrice.webp", x: 70, y: 79, nom: "Jade", habitant: true,
        bulle: { tag: "On raconte · pas vérifié", rumeur: true, texte: "Une pâtisserie ouvrirait près des Halles…" } },
      { id: "marcel", img: "img/artisan.webp", x: 86, y: 66, nom: "Marcel", habitant: true,
        bulle: { tag: "Recherche", texte: "Quelqu’un répare les jouets en bois ?" } },
    ] },
  { nom: "Rue de la librairie", decor: "img/rue.jpg", horizon: 50,
    vitrines: [{ com: "grimoire", x: 0, y: 40, w: 26, h: 28 }, { com: "douceurs", x: 84, y: 42, w: 16, h: 20 }],
    ardoise: { com: "grimoire", x: 12, y: 89, texte: "Nouveau roman !" },
    persos: [
      { id: "libraire", img: "img/libraire.webp", x: 18, y: 76, nom: "Le Grimoire", com: "grimoire" },
      { id: "jade", img: "img/exploratrice.webp", x: 76, y: 82, nom: "Jade", habitant: true,
        bulle: { tag: "Bonne adresse", texte: "La tarte aux pommes d’à côté est top !" } },
    ] },
];
const BULLES_COMMERCES = { pain: "Les premiers croissants sortent du four !", grimoire: "Un nouveau roman vient d’arriver !" };

// ── L'ÉTAT ───────────────────────────────────────────────────────────────────────────────────
const $ = (s) => document.querySelector(s);
const etat = { lieu: 0, famille: new Set(), interets: new Set(["bons", "nouveautes", "voisins"]), occupe: false };
const MAISON = { x: 50, y: 93 };
let toi, tourBulles = 0, minuteurBulles;

const taille = (y, k = 0.72) => Math.max(8, (y - LIEUX[etat.lieu].horizon) * k); // en % de la hauteur de la scène

function poser(el, x, y) {
  el.style.left = x + "%";
  el.style.top = y + "%";
  el.style.height = taille(y, el.classList.contains("toi") ? 0.5 : 0.72) + "%";
  el.style.zIndex = String(2 + Math.round(y));
  el.dataset.x = x; el.dataset.y = y;
}

function perso(p) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "perso";
  b.setAttribute("aria-label", p.nom);
  b.innerHTML = `<img src="${p.img}" alt=""><span class="etiquette">${p.nom}</span>`;
  poser(b, p.x, p.y);
  b.addEventListener("click", (e) => { e.stopPropagation(); p.com ? allerVers(p.com, p.x + 9, p.y + 3) : habitant(p); });
  return b;
}

function dessiner() {
  const L = LIEUX[etat.lieu];
  $("#decor").style.backgroundImage = `url(${L.decor})`;
  $("#flou").style.backgroundImage = `url(${L.decor})`;
  $("#nomLieu").innerHTML = `${L.nom}<small>${etat.lieu + 1} / ${LIEUX.length} · glisse</small>`;
  const c = $("#calque");
  c.innerHTML = "";
  for (const v of L.vitrines) {
    const z = document.createElement("button");
    z.type = "button"; z.className = "vitrine";
    z.setAttribute("aria-label", COMMERCES[v.com].nom);
    Object.assign(z.style, { left: v.x + "%", top: v.y + "%", width: v.w + "%", height: v.h + "%" });
    z.addEventListener("click", (e) => { e.stopPropagation(); allerVers(v.com, Math.min(90, Math.max(10, v.x + v.w / 2)), Math.max(v.y + v.h + 8, 72)); });
    c.appendChild(z);
  }
  if (L.ardoise) {
    const a = document.createElement("div");
    a.className = "ardoise"; a.textContent = L.ardoise.texte;
    Object.assign(a.style, { left: L.ardoise.x + "%", top: L.ardoise.y + "%", zIndex: String(2 + L.ardoise.y) });
    a.addEventListener("click", (e) => { e.stopPropagation(); allerVers(L.ardoise.com, L.ardoise.x + 10, L.ardoise.y + 4); });
    c.appendChild(a);
  }
  for (const p of L.persos) c.appendChild(perso(p));
  toi = document.createElement("button");
  toi.type = "button"; toi.className = "perso toi";
  toi.setAttribute("aria-label", "Ton compagnon : touche-le pour l’envoyer en mission");
  toi.innerHTML = `<img src="img/detective.webp" alt=""><span class="etiquette">Toi</span>`;
  poser(toi, MAISON.x, MAISON.y);
  toi.addEventListener("click", (e) => { e.stopPropagation(); choisirMission(); });
  c.appendChild(toi);
  cacherBulles();
}

// ── LES BULLES, CHACUN SON TOUR ──────────────────────────────────────────────────────────────
function cacherBulles() { document.querySelectorAll(".bulle").forEach((b) => b.remove()); }
function bulle(x, y, h, contenu, rumeur) {
  const b = document.createElement("div");
  b.className = "bulle" + (rumeur ? " rumeur" : "");
  b.innerHTML = contenu;
  b.style.left = Math.min(76, Math.max(24, x)) + "%";
  b.style.top = (y - h) + "%";
  $("#calque").appendChild(b);
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add("vue")));
  setTimeout(() => { b.classList.remove("vue"); setTimeout(() => b.remove(), 400); }, 3000);
}
function bullesSuivantes() {
  if (etat.occupe || !$("#porte").classList.contains("ouvre")) return;
  const L = LIEUX[etat.lieu];
  const parleurs = L.persos.filter((p) => p.bulle || p.com);
  const p = parleurs[tourBulles++ % parleurs.length];
  const h = taille(p.y);
  if (p.com) bulle(p.x, p.y, h, `<small>${COMMERCES[p.com].nom}</small>${BULLES_COMMERCES[p.com]}`);
  else bulle(p.x, p.y, h, `<small>${p.nom} · ${p.bulle.tag}</small>${p.bulle.texte}`, p.bulle.rumeur);
}

// ── TON COMPAGNON MARCHE ─────────────────────────────────────────────────────────────────────
function pas(x, y) {
  const s = document.createElement("i");
  s.className = "pas"; s.style.left = x + "%"; s.style.top = y + "%";
  $("#calque").appendChild(s);
  setTimeout(() => s.remove(), 1700);
}
function marcher(x, y) {
  return new Promise((ok) => {
    const x0 = +toi.dataset.x, y0 = +toi.dataset.y;
    for (let k = 1; k <= 4; k++) setTimeout(() => pas(x0 + ((x - x0) * k) / 5 + (k % 2 ? -1.5 : 1.5), y0 + ((y - y0) * k) / 5), k * 220);
    toi.classList.add("marche");
    toi.style.transform = `translate(-50%,-100%) scaleX(${x < x0 ? -1 : 1})`;
    poser(toi, x, y);
    setTimeout(() => { toi.classList.remove("marche"); toi.style.transform = ""; ok(); }, 1150);
  });
}

async function allerVers(cle, x, y) {
  if (etat.occupe) return;
  etat.occupe = true;
  cacherBulles();
  await marcher(Math.min(88, Math.max(12, x)), Math.min(96, y));
  feuilleCommerce(cle);
}

// ── LES FEUILLES ─────────────────────────────────────────────────────────────────────────────
function ouvrir(html, apres) {
  $("#contenu").innerHTML = html;
  $("#voile").classList.add("ouvert");
  $("#feuille").classList.add("ouverte");
  $("#feuille").scrollTop = 0;
  etat.apres = apres;
  setTimeout(() => $("#fermer").focus({ preventScroll: true }), 300);
}
async function fermer() {
  $("#voile").classList.remove("ouvert");
  $("#feuille").classList.remove("ouverte");
  const apres = etat.apres; etat.apres = null;
  if (apres) await apres();
  if (toi && (+toi.dataset.x !== MAISON.x || +toi.dataset.y !== MAISON.y)) await marcher(MAISON.x, MAISON.y);
  etat.occupe = false;
}
function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("vu");
  clearTimeout(toast.m); toast.m = setTimeout(() => el.classList.remove("vu"), 2400);
}

function feuilleCommerce(cle) {
  const c = COMMERCES[cle];
  const dedans = etat.famille.has(cle);
  const [n, total] = c.collection;
  ouvrir(`
    <div class="carte-com">
      <span class="fig" style="background:linear-gradient(160deg,${c.a},${c.b})">${c.fig ? `<img src="${c.fig}" alt="">` : `<b style="color:#fff;font-size:30px;align-self:center">🧁</b>`}</span>
      <div><h2>${c.nom}</h2><p class="sous">${c.metier} · Dax${c.fig ? "" : " · sa figurine arrive bientôt"}</p></div>
    </div>
    <div class="bloc"><small>Sa pancarte du jour · publiée ${c.publie}</small><b>${c.pancarte}</b><span>Visible par tout le monde.</span></div>
    <div class="bloc famille ${dedans ? "ouvert" : "ferme"}" id="blocFamille">
      <small>🔒 Réservé à sa famille</small><b>${c.famille}</b><span>Ses fidèles le voient avant les autres.</span>
      <div class="cadenas"><button class="action" type="button" id="rejoindre">👻 Libère ton fantôme pour le voir</button></div>
    </div>
    <div class="bloc"><small>Sa collection</small><b>${n} / ${total} figurines</b><span>Passe le voir : tu gagnes sa figurine de l’édition Automne (encore 49 jours).</span></div>`);
  const r = $("#rejoindre");
  if (r) r.addEventListener("click", () => {
    etat.famille.add(cle);
    $("#blocFamille").className = "bloc famille ouvert";
    toast(`Tu fais partie de la famille de ${c.nom} 🎉`);
  });
}

function habitant(p) {
  if (etat.occupe) return;
  etat.occupe = true;
  cacherBulles();
  marcher(Math.min(86, p.x - 10), Math.min(96, p.y + 4)).then(() => {
    const rech = p.bulle.tag === "Recherche";
    ouvrir(`
      <div class="carte-com"><span class="fig" style="background:linear-gradient(160deg,#A8DBFF,#2B4FA6)"><img src="${p.img}" alt=""></span>
        <div><h2>${p.nom}</h2><p class="sous">Habitant·e de Dax · figurine visible parce que ${p.nom} l’a choisi</p></div></div>
      <div class="bloc"><small>${p.bulle.tag}</small><b>${p.bulle.texte}</b>
        <span>${p.bulle.rumeur ? "Ce n’est pas vérifié : on le dit comme ça se dit, sans nom ni accusation." : "Publié par " + p.nom + " ce matin."}</span></div>
      <div class="rang">${rech ? `<button class="action" type="button" id="repondre">Je connais quelqu’un</button>` : ""}<button class="action clair" type="button" id="merci">👍 Merci pour l’info</button></div>`);
    const r = $("#repondre");
    if (r) r.addEventListener("click", () => toast(`Ta réponse est partie à ${p.nom} (maquette)`));
    $("#merci").addEventListener("click", () => toast(`${p.nom} saura que ça t’a servi`));
  });
}

// ── LA MISSION ───────────────────────────────────────────────────────────────────────────────
const INTERETS = [["bons", "Bons plans"], ["nouveautes", "Nouveautés"], ["dejeuner", "Où déjeuner"], ["evenements", "Événements"], ["voisins", "Questions des voisins"]];
function choisirMission() {
  if (etat.occupe) return;
  etat.occupe = true;
  cacherBulles();
  ouvrir(`
    <h2>Va voir ce qui se passe</h2>
    <p class="sous">Ton compagnon fait le tour des commerces et revient avec ce qui t’intéresse.</p>
    <div class="rang" role="group" aria-label="Ce qu’il cherche">${INTERETS.map(([k, t]) => `<button class="puce" type="button" data-k="${k}" aria-pressed="${etat.interets.has(k)}">${t}</button>`).join("")}</div>
    <div class="rang"><button class="action" type="button" id="partir">🔎 Envoyer en mission</button></div>
    <p class="regle">Il ne rapporte que ce qui a vraiment été publié : jamais une remise inventée, jamais une rencontre qui n’a pas eu lieu.</p>`);
  document.querySelectorAll(".puce").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.k; etat.interets.has(k) ? etat.interets.delete(k) : etat.interets.add(k);
    b.setAttribute("aria-pressed", String(etat.interets.has(k)));
  }));
  $("#partir").addEventListener("click", () => { etat.envoyer = true; fermerMission(); });
}
async function fermerMission() {
  $("#voile").classList.remove("ouvert");
  $("#feuille").classList.remove("ouverte");
  etat.apres = null;
  if (!etat.envoyer) { etat.occupe = false; return; }
  etat.envoyer = false;
  await marcher(108, 88);
  $("#enCours").hidden = false;
  await new Promise((ok) => setTimeout(ok, 3200));
  $("#enCours").hidden = true;
  toi.style.transition = "none"; poser(toi, -8, 88); void toi.offsetWidth; toi.style.transition = "";
  await marcher(MAISON.x, MAISON.y);
  rapport();
}
function rapport() {
  const i = etat.interets, items = [];
  if (i.has("bons")) items.push(["🥐", "com", "Au Pain Doré", etat.famille.has("pain") ? "6 chocolatines pour la famille jusqu’à 10 h." : "Une info réservée à sa famille : libère ton fantôme pour la voir.", "Publié par Au Pain Doré à 7 h 42"]);
  if (i.has("nouveautes")) items.push(["📚", "com", "Le Grimoire", "Un nouveau roman vient d’arriver.", "Publié par Le Grimoire à 9 h 05"]);
  if (i.has("evenements")) items.push(["📖", "evt", "Le Grimoire", "Lecture à voix haute samedi à 10 h, 4 places.", "Annoncé par Le Grimoire"]);
  if (i.has("voisins")) items.push(["🧸", "rech", "Marcel", "Cherche quelqu’un qui répare les jouets en bois. Tu connais ?", "Question de Marcel ce matin"]);
  if (i.has("dejeuner")) items.push(["🍽️", "rum", "Où déjeuner", "Rien de publié pour l’instant. Je repasse à 11 h.", "Je préfère ne rien inventer"]);
  const tags = { com: "Nouvelle d’un commerce", evt: "Événement", rech: "Recherche d’un voisin", rum: "Rien de neuf" };
  ouvrir(`
    <h2>Me revoilà ! 🔎</h2>
    <p class="sous">J’ai fait le tour de la place et de la rue de la librairie. Voilà ce que j’ai trouvé pour toi :</p>
    <ul class="liste">${items.length ? items.map(([e, t, qui, quoi, src]) => `<li><i>${e}</i><span><span class="tag ${t}">${tags[t]}</span><b>${qui} : ${quoi}</b><small>${src}</small></span></li>`).join("") : `<li><i>🤷</i><span><b>Tu ne m’as rien demandé de chercher !</b><small>Choisis au moins un centre d’intérêt.</small></span></li>`}</ul>
    <p class="regle">Tout vient de ce que les commerçants et les voisins ont publié aujourd’hui.</p>`);
}

function feuilleRaconte() {
  if (etat.occupe) return;
  etat.occupe = true;
  cacherBulles();
  ouvrir(`
    <h2>On raconte quoi à Dax ?</h2>
    <p class="sous">Aujourd’hui, autour de toi</p>
    <ul class="liste">
      <li><i>📚</i><span><span class="tag com">Nouvelle d’un commerce</span><b>Un nouveau roman vient d’arriver au Grimoire.</b><small>Le Grimoire · il y a 2 h</small></span></li>
      <li><i>🧸</i><span><span class="tag rech">Recherche</span><b>Quelqu’un répare les jouets en bois ?</b><small>Marcel · il y a 40 min</small></span></li>
      <li><i>🥧</i><span><span class="tag">Bonne adresse</span><b>La tarte aux pommes des Douceurs est top !</b><small>Jade · il y a 25 min</small></span></li>
      <li><i>👂</i><span><span class="tag rum">On raconte · pas vérifié</span><b>Une pâtisserie ouvrirait près des Halles…</b><small>Jade · il y a 10 min</small></span></li>
    </ul>
    <p class="regle">Ce qui est vérifié et ce qui se raconte ne se mélangent pas. Jamais de nom dans une rumeur, jamais d’accusation.</p>`);
}

function feuilleCollection() {
  if (etat.occupe) return;
  etat.occupe = true;
  cacherBulles();
  ouvrir(`
    <h2>Ma collection</h2>
    <p class="sous">6 figurines, tous commerces confondus</p>
    <div class="collec">
      <div style="--a:#FFA24A;--b:#7C3110"><span><img src="img/chef.webp" alt=""></span><b>Au Pain Doré</b><small>3 / 10</small></div>
      <div style="--a:#B98CFF;--b:#3A1A8C"><span><img src="img/libraire.webp" alt=""></span><b>Le Grimoire</b><small>2 / 10</small></div>
      <div style="--a:#FFB8D6;--b:#8E1442" class="ombre"><span><img src="img/chef.webp" alt=""></span><b>Les Douceurs</b><small>1 / 10</small></div>
    </div>
    <div class="bloc famille ouvert" style="margin-top:14px"><small>Ta propre figurine</small><b>Encore 4 figurines</b><span>À 10, ton compagnon devient ta figurine à ton image : elle parle avec ta voix, tu l’envoies à tes proches, et elle cite tes commerces préférés.</span></div>`);
}

// ── LES GESTES ───────────────────────────────────────────────────────────────────────────────
function changerLieu(d) {
  if (etat.occupe) return;
  const n = (etat.lieu + d + LIEUX.length) % LIEUX.length;
  const decor = $("#decor");
  decor.classList.add("sort");
  setTimeout(() => { etat.lieu = n; dessiner(); decor.classList.remove("sort"); }, 380);
}
$("#avant").addEventListener("click", () => changerLieu(-1));
$("#apres").addEventListener("click", () => changerLieu(1));
$("#mission").addEventListener("click", choisirMission);
$("#moi").addEventListener("click", feuilleCollection);
$("#collection").addEventListener("click", feuilleCollection);
$("#raconte").addEventListener("click", feuilleRaconte);
$("#fermer").addEventListener("click", () => ($("#partir") ? fermerMission() : fermer()));
$("#voile").addEventListener("click", () => ($("#partir") ? fermerMission() : fermer()));
let x0 = null;
$("#scene").addEventListener("pointerdown", (e) => { x0 = e.clientX; });
$("#scene").addEventListener("pointerup", (e) => {
  if (x0 === null) return;
  const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 60 && $("#porte").classList.contains("ouvre") && !$("#feuille").classList.contains("ouverte")) changerLieu(dx < 0 ? 1 : -1);
});
const entrer = () => {
  const p = $("#porte");
  if (p.classList.contains("ouvre")) return;
  p.classList.add("ouvre");
  setTimeout(() => { document.querySelectorAll(".vitrine").forEach((v) => v.classList.add("repere")); bullesSuivantes(); }, 900);
};
$("#porte").addEventListener("click", entrer);
$("#porte").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); entrer(); } });
$("#porte").style.backgroundImage = "url(img/porte.jpg)";
dessiner();
minuteurBulles = setInterval(bullesSuivantes, 3400);
</script>
