<title>Découvrir ClikMe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;800;900&display=swap">
<style>
/* L'appli dans une colonne de téléphone : chaque écran remplit la hauteur ; seul l'accueil défile.
   Une seule ambiance, celle de ClikMe : la nuit brune, le rose pour ce qu'on touche, l'ambre pour ce qui s'allume. */
:root{
  --nuit:#160711; --nuit2:#22101e; --carte:#2b1327; --carte2:#3a1a35; --trait:rgba(255,255,255,.1);
  --texte:#FFF4E6; --doux:#ead3df; --sourd:#a88a9b; --rose:#FF2E9A; --ambre:#F2C46B; --vert:#45d483; --refus:#ff7b8a;
  --papier:#fff6ea; --encre:#2a1424;
  --f-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-main:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#0b0309;color:var(--texte);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;background:radial-gradient(130% 55% at 50% 0%,#3a1430 0%,var(--nuit) 62%);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.vue{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ─── boutons ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:15px;color:#2a0f1f;background:linear-gradient(135deg,#ff6fbd,var(--rose) 55%,#ff5a7a);box-shadow:0 10px 24px -10px rgba(255,46,154,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.petit{padding:9px 14px;font-size:14px}
.btn.ambre{background:linear-gradient(135deg,#ffe0a0,var(--ambre));box-shadow:0 10px 24px -12px rgba(242,196,107,.9)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--trait);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.07);font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:rgba(255,46,154,.22);border-color:rgba(255,46,154,.6)}
.rond{display:grid;place-items:center;width:40px;height:40px;flex:none;border:1px solid var(--trait);border-radius:50%;background:rgba(20,8,16,.55);font-size:17px;font-family:var(--f-ui),var(--emoji);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.petit-rond{width:30px;height:30px;font-size:14px}
.rond.on{background:rgba(255,46,154,.3);border-color:rgba(255,46,154,.7)}

/* ─── Tes passions ─── */
#v-passions{overflow:auto}
.passions{padding-top:22px;padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
.sur{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ambre)}
h1{margin:0;font-weight:900;font-size:30px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.intro{margin:0;color:var(--doux);font-size:15px;line-height:1.45}
.tuiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:6px}
.tuile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;aspect-ratio:1/1;border:2px solid transparent;border-radius:20px;padding:8px 4px;background:var(--fond);font-weight:800;font-size:12.5px;line-height:1.15;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.tuile .e{font-family:var(--emoji);font-size:32px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.tuile .coche{position:absolute;top:6px;right:6px;display:none;width:20px;height:20px;border-radius:50%;background:var(--rose);color:#fff;font-style:normal;font-size:12px;line-height:20px}
.tuile.prise{border-color:var(--rose);transform:scale(.96)}
.tuile.prise .coche{display:block}
.note{margin:4px 0 0;font-size:13.5px;color:var(--sourd)}
.bas-passions{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto;background:linear-gradient(180deg,rgba(22,7,17,0),var(--nuit) 30%)}
.bas-passions span{font-weight:800;color:var(--doux)}

/* ─── l'accueil de Découvrir ─── */
.tete-accueil{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 8px}
.tete-accueil h1{font-size:26px}
.tete-accueil div{display:flex;gap:8px;align-items:center}
.defile{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:110px}
.pile{display:flex;flex-direction:column;gap:12px}
.carte-tele{position:relative;display:block;width:100%;padding:0;border:0;border-radius:26px;overflow:hidden;background:var(--carte);text-align:left;box-shadow:0 22px 40px -22px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.08)}
.carte-tele .vig{aspect-ratio:390/300}
.carte-tele .vig svg{display:block;width:100%;height:100%}
.tdj{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 16px 16px;margin-top:-30px;background:linear-gradient(180deg,rgba(43,19,39,0),var(--carte) 26px)}
.tdj h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.01em}
.tdj .themes{margin:0;color:var(--doux);font-weight:600;font-size:14px}
.deja{display:flex;align-items:center;gap:10px;margin:2px 0 4px;font-size:13.5px;line-height:1.35;color:var(--doux)}
.deja .tetes{display:flex;flex:none}
.deja .tetes svg{width:30px;height:30px;margin-right:-8px;border-radius:50%;background:#4a2440;box-shadow:0 0 0 2px var(--carte)}
.tdj .btn{align-self:flex-start}
.allume{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(14,6,12,.7);font-size:12px;font-weight:800}
.allume i{width:8px;height:8px;border-radius:50%;background:var(--ambre);box-shadow:0 0 10px var(--ambre);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.slogan{margin:2px 4px 6px;font-family:var(--f-main);font-size:22px;line-height:1.15;color:var(--ambre);text-align:center;text-wrap:balance}
.titre-sec{display:flex;align-items:baseline;gap:8px;margin:10px 0 0;font-size:19px;font-weight:900}
.titre-sec small{font-size:13px;font-weight:600;color:var(--sourd)}
.sous-sec{margin:-6px 0 2px;font-size:13.5px;color:var(--sourd);line-height:1.4}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.carte-salon{display:flex;flex-direction:column;gap:3px;min-width:0;padding:0 0 11px;border:0;border-radius:20px;overflow:hidden;background:var(--carte);text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.carte-salon .vig{position:relative;aspect-ratio:390/330;margin-bottom:6px}
.carte-salon .vig svg{display:block;width:100%;height:100%}
.carte-salon b{padding:0 11px;font-size:14px;font-weight:800;line-height:1.2}
.carte-salon small{padding:0 11px;font-size:12px;color:var(--sourd);line-height:1.3}
.ici{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(14,6,12,.72);font-size:11.5px;font-weight:800}
.ici i{width:7px;height:7px;border-radius:50%;background:var(--vert);box-shadow:0 0 8px var(--vert)}
.carte-potins{display:grid;grid-template-columns:42% minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:0 12px 0 0;border:0;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#3b2016,#2b1327);text-align:left;box-shadow:inset 0 0 0 1px rgba(242,196,107,.25)}
.carte-potins .vig{position:relative;height:100%;min-height:128px}
.carte-potins .vig svg{position:absolute;inset:0;width:100%;height:100%}
.carte-potins div:last-child{display:flex;flex-direction:column;gap:4px;padding-block:12px}
.carte-potins b{font-size:16px;font-weight:900}
.carte-potins small{font-size:12.5px;color:var(--doux);line-height:1.35}
.carte-potins em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--ambre)}
.nav{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr;align-items:end;max-width:440px;margin:0 auto;padding:7px 6px 6px;border-radius:28px;background:linear-gradient(180deg,rgba(46,16,36,.92),rgba(22,7,17,.95));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 18px 40px -14px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.09)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:4px 0 2px;border:0;background:none;color:#9C8290}
.nav span{display:grid;place-items:center;width:44px;height:34px;border-radius:14px}
.nav small{font-size:11px;font-weight:800;white-space:nowrap}
.nav .pris{color:var(--texte)}
.nav .pris span{transform:translateY(-3px);background:linear-gradient(135deg,rgba(255,46,154,.32),rgba(242,196,107,.22));box-shadow:0 8px 18px -8px rgba(255,46,154,.9)}
.nav .pris small{background:linear-gradient(90deg,#FFC8E6,#F2C46B);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ─── la barre du haut, la scène ─── */
.barre{display:flex;align-items:center;gap:8px;padding-block:10px 8px;z-index:5}
.barre-titre{display:flex;flex-direction:column;flex:1;min-width:0}
.barre-titre b{font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre-titre small{font-size:12px;color:var(--sourd);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene-wrap{position:relative;flex:1;min-height:0;container-type:size;display:grid;place-items:center;overflow:hidden}
.scene{position:relative;width:min(100cqw,75cqh);height:min(100cqh,133.333cqw);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.decor{position:absolute;inset:0}
.decor svg{display:block;width:100%;height:100%}
.tele{position:absolute;left:15.38%;top:9.23%;width:69.23%;height:29.23%;border-radius:7px;overflow:hidden;background:#05060c;box-shadow:0 0 0 5px #120810,0 0 0 6px rgba(255,255,255,.07),0 0 46px rgba(130,180,255,.32);z-index:2}
.tele canvas{display:block;width:100%;height:100%}
/* 📺 le grand écran (par défaut) : la télé prend toute la largeur du téléphone, la pièce et les figurines dessous */
.scene-wrap.grand .scene{width:100cqw;height:100cqh}
.scene-wrap.grand .tele{left:0;top:0;width:100%;height:auto;aspect-ratio:16/9;border-radius:0;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.scene-wrap.grand .bord{left:auto;right:3%;top:calc(56.25cqw + 8px);transform:none}
.scene-wrap.grand .seul,.scene-wrap.grand .voix-dispo{top:calc(56.25cqw + 10px)}
.taille-tele{position:absolute;left:6px;bottom:5px;z-index:4;display:flex;align-items:center;gap:4px;padding:3px 8px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:800}
.tele-titre{position:absolute;inset:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:7px 10px 18px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));opacity:0;transition:opacity .3s;pointer-events:none}
.tele-titre.montre{opacity:1}
.tele-titre small{font-size:10px;font-weight:600;color:#ddd}
.tele-titre b{font-size:12.5px;font-weight:800;line-height:1.2}
.tele-voix{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(10,4,9,.72);font-size:14px;font-weight:900;text-align:center;pointer-events:none;animation:apparait .25s ease-out}
.tele-voix .onde{height:22px}.tele-voix .onde i{width:4px}
.voix-dispo{position:absolute;left:50%;top:41%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;width:max-content;max-width:94%;padding:7px 8px 7px 13px;border:0;border-radius:999px;background:rgba(255,226,241,.97);color:#2a1424;font-size:12.5px;font-weight:800;z-index:9;box-shadow:0 10px 24px rgba(0,0,0,.45);animation:apparait .3s ease-out}
.voix-dispo b{padding:5px 11px;border-radius:999px;background:var(--rose);color:#fff;font-size:12px}
.voix-dispo.part{opacity:0;transition:opacity .4s}
.ligne-conv .ecoute{flex:none;margin-left:auto;padding:5px 10px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:12px;font-weight:800}
.ligne-conv.joue{background:rgba(255,46,154,.16)}
.tele-pause{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:900;background:rgba(0,0,0,.25);pointer-events:none}
.tele-yt{position:absolute;right:6px;bottom:5px;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.55);font-size:9.5px;font-weight:800;color:#fff;pointer-events:none}
.tele-yt b{color:#ff3b3b}
.tele-fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;background:rgba(10,4,9,.84);text-align:center;font-size:13px;font-weight:700}
.tele-fin p{margin:0;color:var(--doux);font-size:12.5px}
.tele-fin div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stade{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;align-items:flex-end;justify-content:center;gap:1px;pointer-events:none;opacity:0;transition:opacity .3s}
.stade.actif{opacity:1}
.stade svg{width:5.2%;height:auto;flex:none;transform:translateY(40%)}
.stade.actif svg{animation:hop .5s ease-out infinite alternate;animation-delay:var(--d)}
@keyframes hop{to{transform:translateY(-6%)}}
.stade-txt{position:absolute;top:6px;left:50%;transform:translateX(-50%);margin:0;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.66);font-size:10.5px;font-weight:800;white-space:nowrap;z-index:3}
.bord{position:absolute;left:16.5%;top:38.6%;display:flex;gap:2px;z-index:3;transform:translateY(-50%)}
.petite{position:relative;width:26px}
.petite svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.petite.hop{animation:petitHop .5s ease-out 2}
@keyframes petitHop{50%{transform:translateY(-9px)}}
.seul{position:absolute;left:50%;top:41.5%;transform:translateX(-50%);margin:0;width:max-content;max-width:86%;padding:6px 12px;border-radius:14px;background:rgba(14,6,12,.7);font-size:12.5px;font-weight:700;text-align:center;z-index:3}
.indice{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:max-content;max-width:92%;padding:8px 13px;border-radius:16px;background:rgba(14,6,12,.78);font-size:12.5px;font-weight:700;text-align:center;line-height:1.35;pointer-events:none;z-index:8;animation:apparait .3s ease-out;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@keyframes apparait{from{opacity:0;transform:translate(-50%,8px)}}
.pastille-cam{position:absolute;top:2%;left:3%;display:flex;align-items:center;gap:6px;padding:5px 10px;border:0;border-radius:999px;background:rgba(14,6,12,.78);color:var(--texte);font-size:11.5px;font-weight:800;z-index:9}
.pastille-cam i{width:8px;height:8px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 10px #ff3b5c;animation:pulse 1.2s infinite}
.micro-on{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,46,154,.9);font-size:13px;font-weight:800;z-index:9;white-space:nowrap}

/* ─── les figurines ─── */
.fig{position:absolute;transform:translateX(-50%);transition:left 1.3s cubic-bezier(.3,.8,.3,1),opacity .4s;z-index:3}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .tete{transform-box:view-box;transform-origin:50px 90px;animation:vit 4.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes vit{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.fig .y-n{transform-box:fill-box;transform-origin:center;animation:cligne 5.3s infinite;animation-delay:var(--d,0s)}
@keyframes cligne{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.s-o,.y-o,.y-r,.y-b,.y-c,.b-r,.b-o,.b-b{display:none}
[data-x="rire"] .y-n,[data-x="rire"] .b-n,[data-x="oh"] .y-n,[data-x="oh"] .b-n,[data-x="coeur"] .y-n,[data-x="bof"] .y-n,[data-x="bof"] .b-n{display:none}
[data-x="rire"] .y-r,[data-x="rire"] .b-r,[data-x="oh"] .y-o,[data-x="oh"] .b-o,[data-x="oh"] .s-o,[data-x="coeur"] .y-c,[data-x="bof"] .y-b,[data-x="bof"] .b-b{display:inline}
.fig.rit .tete{animation:rit .42s ease-in-out 3}
@keyframes rit{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-8deg)}50%{transform:translateY(-1px)}75%{transform:translateY(-7px) rotate(8deg)}}
.fig.saute{animation:saute .46s ease-out 2}
@keyframes saute{0%,100%{transform:translate(-50%,0)}40%{transform:translate(-50%,-15%)}}
.fig.penche .tete{animation:penche 1.4s ease-in-out}
@keyframes penche{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-13deg) translateY(2px)}}
.fig.somnole .tete{animation:somnole 1.8s ease-in-out}
@keyframes somnole{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(12deg) translateY(5px)}}
.fig.pulse .tete{animation:battre .5s ease-in-out 3}
@keyframes battre{50%{transform:scale(1.08)}}
.fig .bras-d{transform-box:view-box;transform-origin:68px 100px}
.fig.coucou .bras-d{animation:coucou .26s ease-in-out 7 alternate}
@keyframes coucou{from{transform:rotate(-125deg)}to{transform:rotate(-165deg)}}
.fig.estompe{opacity:.32}
.fig .bras-g{transform-box:view-box;transform-origin:32px 100px}
.fig.bras-haut .bras-d{animation:brasD 1.3s ease-in-out}
.fig.bras-haut .bras-g{animation:brasG 1.3s ease-in-out}
@keyframes brasD{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(-155deg)}}
@keyframes brasG{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(155deg)}}
.fig.bras-haut .tete{animation:rit .32s ease-in-out 4}
.fig.recule .tete{animation:recule .6s ease-out forwards}
@keyframes recule{0%{transform:none}35%{transform:translateY(-7px) rotate(-10deg) scale(1.07)}100%{transform:translateY(-3px) rotate(-6deg) scale(1.03)}}
.fig.plie{animation:plie 1.3s ease-in-out}
.fig.plie .tete{animation:rit .32s ease-in-out 4}
@keyframes plie{0%,100%{transform:translate(-50%,0) rotate(0)}30%,70%{transform:translate(-50%,5%) rotate(6deg)}}
.vraie-tete{position:absolute;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;background:var(--rose);color:#fff;font-size:10.5px;font-weight:900;white-space:nowrap;z-index:8;pointer-events:none;animation:apparait .3s ease-out}
.synchro{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,#fff0c8,var(--ambre));color:#2a1424;font-weight:900;font-size:15px;white-space:nowrap;z-index:9;pointer-events:none;box-shadow:0 10px 30px rgba(242,196,107,.55);animation:synchro 2.2s ease-out forwards}
@keyframes synchro{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}24%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.fin-carte{position:absolute;left:4%;right:4%;top:2.5%;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px;border-radius:18px;background:rgba(10,4,9,.92);box-shadow:0 14px 34px rgba(0,0,0,.6);text-align:center;font-size:13px;font-weight:700;z-index:9;animation:apparait .3s ease-out}

function toast(msg,{ms=2800,refuse=false}={}){
  const z=$('#toasts');while(z.children.length>1)z.firstChild.remove();
  const t=document.createElement('div');t.className='toast'+(refuse?' refuse':'');t.textContent=msg;z.appendChild(t);

}

// ─── la télé : un lecteur (le temps de la vidéo, à la seconde) ───
class Tele{
  constructor(el,o={}){this.el=el;this.c=$('canvas',el).getContext('2d');this.o=o;this.t=0;this.joue=false;this.actif=true;this.boucle=!!o.boucle;this.f=this.frame.bind(this);requestAnimationFrame(this.f)}
  charger(v,t=0){this.v=v;this.t=t;this.fini=false;$('.tele-titre small',this.el).textContent='▶ '+v.chaine;$('.tele-titre b',this.el).textContent=v.titre;$('.tele-fin',this.el)?.remove();this.dessiner()}
  jouer(){this.joue=true;this.dernier=performance.now();$('.tele-pause',this.el).hidden=true}
  pause(){this.joue=false;$('.tele-pause',this.el).hidden=false}
  aller(t){this.t=Math.max(0,Math.min(this.v.duree,t));this.fini=false;$('.tele-fin',this.el)?.remove()}
  frame(now){
    if(!this.actif)return;
    const dt=Math.min(.1,(now-(this.dernier||now))/1000);this.dernier=now;
    if(this.joue&&this.v){const t0=this.t;this.t=Math.min(this.v.duree,this.t+dt);this.o.tick?.(t0,this.t);
      if(this.t>=this.v.duree){if(this.boucle){this.t=0;this.o.tick?.(-1,0)}else{this.joue=false;this.fini=true;this.o.fin?.()}}}
    this.dessiner();requestAnimationFrame(this.f);
  }
  dessiner(){if(!this.v)return;DESSINS[this.v.dessin](this.c,this.t,this.v);$('.tele-titre',this.el).classList.toggle('montre',this.t<3.5||!this.joue)}
  arreter(){this.actif=false}
}

const SORTES={bravo:{x:'rire',a:'pulse',e:'👏',n:3,ms:1300},rire:{x:'rire',a:'rit',e:'😂',ms:1500},sourire:{x:'rire',a:'',e:'😊',ms:1100},coeur:{x:'coeur',a:'pulse',e:'❤️',n:3,ms:1600},oh:{x:'oh',a:'penche',b:'oh !',ms:1400},surprise:{x:'oh',a:'saute',e:'😱',ms:1300},bof:{x:'bof',a:'somnole',e:'😴',ms:1800}};
const EMO={bravo:'👏',rire:'😂',sourire:'😊',coeur:'❤️',oh:'😮',surprise:'😱',bof:'😴',texte:'💬',vocal:'🎙️'};
function reactionAuTexte(t){if(/(\bnul\b|\bbof\b|ennui|😴|🙄)/i.test(t))return 'bof';if(/(ha ?ha|hihi|mdr|ptdr|\blol\b|😂|🤣|😆)/i.test(t))return 'rire';if(/(❤|😍|🥰|j.?adore|trop beau|trop mignon)/i.test(t))return 'coeur';if(/(!|😱|waouh|\bwow\b|\boh\b|quoi)/i.test(t))return 'surprise';return 'sourire'}
function figHTML(id,pl,x={}){
  const p=GENS[id];
  return `<div class="fig${x.cls||''}" data-id="${id}" data-x="n" style="left:${pl.x}%;bottom:${pl.b}%;width:${pl.l}%;--d:${(-Math.random()*4).toFixed(2)}s">${figSVG(p)}<span class="nom"><span>${x.direct?'<i class="dot"></i>':''}${x.nom||p.prenom}</span>${x.vu?`<em>${x.vu}</em>`:''}</span></div>`;
}
function poser(scene,id,pl,x={}){scene.insertAdjacentHTML('beforeend',figHTML(id,pl,x));return scene.lastElementChild}
function entrer(scene,id,pl,x={}){const f=poser(scene,id,{...pl,x:112},x);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.left=pl.x+'%'}));return f}
const figDe=(scene,id)=>scene.querySelector(`.fig[data-id="${id}"]`);
function placerAuDessus(scene,fig,el,dy=.05){
  const sr=scene.getBoundingClientRect(),fr=fig.getBoundingClientRect();
  const x=fr.left+fr.width/2-sr.left;el.style.top=(fr.top-sr.top+fr.height*dy)+'px';el.style.left=x+'px';scene.appendChild(el);
  if(el.classList.contains('bulle')){const w=el.offsetWidth,l=Math.max(w/2+6,Math.min(sr.width-w/2-6,x));el.style.left=l+'px';el.style.setProperty('--f',(x-l+w/2)+'px')}
  return x;
}
function jaillir(scene,el,e){const s=document.createElement('span');s.className='part-e';s.textContent=e;s.style.setProperty('--dx',hasard(-26,26).toFixed(0)+'px');placerAuDessus(scene,el,s,.02);s.style.left=(parseFloat(s.style.left)+hasard(-10,10))+'px';setTimeout(()=>s.remove(),1400)}
function bulle(scene,fig,texte,{vocal=false,petite=false}={}){
  scene.querySelectorAll(`.bulle[data-de="${fig.dataset.id}"]`).forEach(b=>b.remove());
  const b=document.createElement('div');b.className='bulle'+(petite?' petite':'')+(vocal?' vocal':'');b.dataset.de=fig.dataset.id;
  b.innerHTML=vocal?`<span class="onde"><i></i><i></i><i></i><i></i><i></i></span><span>« ${esc(texte)} »</span>`:esc(texte);
  placerAuDessus(scene,fig,b,.03);setTimeout(()=>{b.classList.add('part');setTimeout(()=>b.remove(),320)},vocal?3600:3000);
}
function animer(fig,a,ms){fig.classList.remove('rit','saute','penche','somnole','pulse','coucou');void fig.offsetWidth;fig.classList.add(a);clearTimeout(fig._ta);fig._ta=setTimeout(()=>fig.classList.remove(a),ms)}
function reagir(scene,id,sorte,texte){
  const fig=figDe(scene,id);
  if(!fig){const t=scene.querySelector(`.petite[data-id="${id}"]`);if(t){t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop');jaillir(scene,t,EMO[sorte]||'💬')}return}
  if(fig.classList.contains('estompe'))return;
  let sansEmoji=false;
  if(sorte==='texte'||sorte==='vocal'){bulle(scene,fig,texte,{vocal:sorte==='vocal'});sorte=sorte==='vocal'?'sourire':reactionAuTexte(texte);sansEmoji=true}
  const s=SORTES[sorte]||SORTES.sourire;
  fig.dataset.x=s.x;clearTimeout(fig._tx);fig._tx=setTimeout(()=>fig.dataset.x='n',s.ms);
  if(s.a)animer(fig,s.a,s.ms+200);
  if(!sansEmoji){if(s.e)for(let k=0;k<(s.n||1);k++)setTimeout(()=>jaillir(scene,fig,s.e),k*160);if(s.b)bulle(scene,fig,s.b,{petite:true})}
}
function voler(scene,de,a,e){
  const sr=scene.getBoundingClientRect(),r1=de.getBoundingClientRect(),r2=a.getBoundingClientRect();
  const s=document.createElement('span');s.className='vol';s.textContent=e;s.style.left=(r1.left+r1.width/2-sr.left)+'px';s.style.top=(r1.top-sr.top+r1.height*.2)+'px';scene.appendChild(s);
  const dx=r2.left-r1.left+(r2.width-r1.width)/2,dy=r2.top-r1.top+(r2.height-r1.height)*.2;
  s.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:0},{transform:`translate(calc(-50% + ${dx/2}px),calc(-50% + ${dy/2-40}px)) scale(1.35)`,opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1)`,opacity:1}],{duration:900,easing:'ease-in-out'}).onfinish=()=>s.remove();
}
function indice(scene,txt,ms=4200){scene.querySelector('.indice')?.remove();const p=document.createElement('p');p.className='indice';p.textContent=txt;scene.appendChild(p);setTimeout(()=>p.remove(),ms)}
function refus(t){
  if(/(https?:|www\.|\.(com|fr|net)\b)/i.test(t))return 'pas de lien ici';
  if(/(\d[\s.-]?){8,}/.test(t))return 'pas de numéro ici';
  if(/\b(insta|instagram|snap|snapchat|tiktok|whatsapp|discord|telegram)\b|@\w/i.test(t))return 'pas de réseau ni de pseudo : pour se parler à deux, il faut être proches';
  if(/\b(connard|connasse|pute|salope|encul\w*|nique|ntm|batard|bâtard|débile|abruti)\b/i.test(t))return 'ce mot n’a pas sa place ici';
  if(/(t.?habites|ton adresse|ton num|t.?as quel âge|quel lycée|quelle ville)/i.test(t))return 'on ne demande rien de personnel ici';
  return null;
}

const PLACES4=[{x:15,b:7,l:24},{x:38.5,b:7,l:24},{x:61.5,b:7,l:24},{x:85,b:7,l:24}];
const piece={liste:[],i:0,tele:null,mes:{},live:new Set(),cam:false,camOk:false,notes:0,assis:[],flag:new Set(),partages:{}};
const scP=()=>$('#p-scene');

const courante=()=>piece.liste[piece.i];
function assisDe(v){

  vus.sort((a,b)=>compte(b)-compte(a));

  $$('.fig,.bulle,.part-e,.indice,.bandeau,.note-moi,.fin-carte,.synchro,.vraie-tete',sc).forEach(x=>x.remove());
  let assis,petites;

    // 👀 ce que verra ce proche : lui au centre, ta figurine à côté de lui, qui réagit à TES secondes
    const autres=Object.keys(v.vus).filter(id=>id!==vueDe);assis=['moi',...autres.slice(0,2)];petites=autres.slice(2);
    poser(sc,vueDe,PLACES4[1],{vu:'regarde'});poser(sc,'moi',PLACES4[0],{nom:'Alex',vu:'a vu à l’instant'});

    sc.querySelector('.pastille-cam')?.remove();
    sc.insertAdjacentHTML('beforeend',`<div class="bandeau">👀 Ce que ${GENS[vueDe].prenom} verra : « Alex », c’est toi<button type="button" id="b-retour-moi">Revenir</button></div>`);
    $('#b-retour-moi').addEventListener('click',()=>{chargerVideo(piece.i);majCam()});
  }else{
    ({assis,petites}=assisDe(v));piece.rejeu=v.reactions;
    poser(sc,'moi',PLACES4[1]);
    [0,2,3].forEach((k,j)=>{const id=assis[j];if(id)poser(sc,id,PLACES4[k],piece.live.has(id)?{direct:true}:{vu:'a vu '+v.vus[id]})});
  }

function tics(){

function arriver(id){
  if(!piece.tele)return;fermerFeuille();const sc=scP();piece.live.add(id);
  let fig=figDe(sc,id);
  if(fig){fig.querySelector('.nom').innerHTML=`<span><i class="dot"></i>${GENS[id].prenom}</span>`}
  else{
    const libres=[0,2,3].filter(k=>!piece.assis[[0,2,3].indexOf(k)]);
    let k=libres[0];
    if(k===undefined){const sortant=[...piece.assis].reverse().find(x=>!piece.live.has(x)&&x!==id);const j=piece.assis.indexOf(sortant);k=[0,2,3][j];figDe(sc,sortant)?.remove();piece.assis[j]=undefined;

  }

}

  <form id="f-pot"><label class="champ">Quoi ?<input id="pq" maxlength="80" placeholder="${soiree?'Un concert, un marché, une course…':'Une boutique qui ouvre, des travaux…'}"></label><label class="champ">Où ?<input id="po" maxlength="60" placeholder="Un lieu, une rue"></label>${soiree?'<label class="champ">Quand ?<input id="pw" maxlength="40" placeholder="Samedi, 20 h"></label>':''}<div id="pr"></div><button class="btn">Envoyer</button></form>`,f=>
    $('#f-pot',f).addEventListener('submit',e=>{e.preventDefault();const t=[$('#pq',f).value,$('#po',f).value,$('#pw',f)?.value||''].join(' ').trim();if(!$('#pq',f).value.trim())return;
      const alcool=/(open.?bar|dégustation|degustation|bar à|apéro|apero|\bvins?\b|bières?|cocktail|whisky|rhum|vodka|alcool|ivre)/i.test(t),r=alcool?'pas de soirée tournée vers l’alcool ici':refus(t);
      if(r){$('#pr',f).innerHTML=`<p class="refus" style="margin-bottom:10px">🚫 Ça ne part pas : ${esc(r)}.</p>`;return}
      fermerFeuille();toast(soiree?'📅 Envoyé : il apparaîtra dans « À venir » une fois relu':'🗞️ Envoyé : ça apparaîtra une fois relu',{ms:3200})}));
}
